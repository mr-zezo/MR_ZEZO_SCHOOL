<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلزام الصف الأول - منظومة مستر زيزو</title>
    
    <!-- مكتبات Supabase و Excel -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

        /* ================= نظام الألوان الموحد ================= */
        :root { 
            --primary-color: #1e3a8a;    
            --secondary-color: #d97706;  
            --bg-color: #f8fafc;         
            --surface-color: #ffffff;    
            --text-main: #0f172a;        
            --danger: #be123c;           
            --success: #16a34a;          
            --info: #0284c7;             
            --border-color: #cbd5e1;     
        }

        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); margin: 0; padding: 10px 15px; display: flex; flex-direction: column; align-items: center; }
        
        /* ================= الشريط العلوي ================= */
        .top-navigation { width: 100%; max-width: 1000px; background: var(--primary-color); padding: 10px 20px; border-radius: 10px; color: white; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); flex-wrap: wrap; gap: 10px; }
        .nav-title { font-size: 17px; font-weight: 900; color: #e2e8f0; display: flex; align-items: center; gap: 10px; }
        
        .dev-badge { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); color: #fff; padding: 6px 25px; border-radius: 50px; font-size: 13px; font-weight: 900; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 15px; }
        .dev-badge span { color: #fcd34d; font-size: 14px; }
        
        .btn-nav { text-decoration: none; color: white; background: #334155; padding: 6px 20px; border-radius: 6px; font-size: 14px; font-weight: 900; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-nav:hover { background: #1e293b; transform: translateY(-2px); }

        /* ================= الحاوية الرئيسية ================= */
        .container { width: 100%; max-width: 1000px; background: var(--surface-color); padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 5px solid var(--primary-color); }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 800; margin-bottom: 5px; color: var(--text-main); font-size: 14px;}
        
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px; border: 2px solid var(--border-color); border-radius: 6px; font-family: 'Cairo', sans-serif; box-sizing: border-box; font-weight: 800; font-size: 14px; outline: none; transition: 0.2s; background: #fcfcfc;}
        input:focus, select:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); background: white;}

        .split-container { display: flex; gap: 10px; margin-top: 5px; }
        .split-container input { background-color: #f0fdf4; border-color: #bbf7d0; text-align: center; color: var(--success); font-size: 13px; font-weight: 900; }

        .btn-submit { background-color: var(--success); color: white; border: none; padding: 15px; width: 100%; font-size: 16px; font-family: 'Cairo', sans-serif; font-weight: 900; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(22, 163, 74, 0.2);}
        .btn-submit:hover { background-color: #15803d; transform: translateY(-2px);}
        
        /* الإحصائيات */
        .stats-dashboard { display: flex; justify-content: space-between; background: #f1f5f9; padding: 15px; border-radius: 10px; margin-top: 25px; text-align: center; font-weight: 900; gap: 15px; flex-wrap: wrap;}
        .stat-box { flex: 1; min-width: 150px; padding: 15px; background: white; border-radius: 8px; border-top: 4px solid var(--info); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stat-box span { display: block; font-size: 13px; color: #64748b; margin-top: 8px; }
        .stat-val { color: var(--danger); font-size: 20px; }

        /* أزرار التصدير والرجوع */
        .export-group { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap;}
        .export-group button { flex: 1; min-width: 200px; padding: 12px; font-family: 'Cairo'; font-size: 14px; font-weight: 900; border: none; border-radius: 8px; cursor: pointer; color: white; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px;}
        .btn-csv { background-color: var(--secondary-color); } .btn-csv:hover { background-color: #b45309; }
        .btn-excel { background-color: var(--primary-color); } .btn-excel:hover { background-color: #1e40af; }

        /* الجدول والحاوية القابلة للتمرير */
        .table-wrapper { width: 100%; max-height: 400px; overflow-y: auto; margin-top: 15px; border: 1px solid var(--border-color); border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: center; }
        table, th, td { border: 1px solid var(--border-color); }
        th, td { padding: 10px; font-weight: 800; }
        th { background-color: var(--primary-color); color: white; position: sticky; top: 0; z-index: 1; }
        tr:nth-child(even) { background-color: #f8fafc; }
        .btn-edit { background: var(--info); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: 'Cairo'; font-weight: 900; transition: 0.2s;}
        .btn-edit:hover { background: #0369a1; }
        
        .btn-clear-db { margin-top: 25px; background: var(--danger); color: white; border: none; padding: 12px 15px; border-radius: 8px; cursor: pointer; font-weight: 900; font-family: 'Cairo'; width: 100%; font-size: 15px; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px;}
        .btn-clear-db:hover { background: #9f1239; }
    </style>
</head>
<body>

    <nav class="top-navigation">
        <div class="nav-title"><i class="fa-solid fa-user-plus"></i> نظام إدارة بيانات وإلزام الصف الأول</div>
        
        <div class="dev-badge">
            <i class="fa-solid fa-medal" style="color:#fcd34d; font-size:18px;"></i> 
            إعداد وتطوير &nbsp;|&nbsp; <span>أ/ عبدالعزيز لولح</span> &nbsp;|&nbsp; ( مستر زيزو )
        </div>

        <a href="index.html" class="btn-nav"><i class="fa-solid fa-house"></i> الرئيسية</a>
    </nav>

    <div class="container">
        <!-- الحقول -->
        <div class="form-group"><label>اسم التلميذ الخماسي:</label><input type="text" id="studentFullName" class="enter-nav" placeholder="اكتب الاسم واضغط المسطرة..."><div class="split-container"><input type="text" id="st1" readonly placeholder="الأول"><input type="text" id="st2" readonly placeholder="الثاني"><input type="text" id="st3" readonly placeholder="الثالث"><input type="text" id="st4" readonly placeholder="الرابع"><input type="text" id="st5" readonly placeholder="الخامس"></div></div>
        
        <div class="form-group"><label>اسم الأم الرباعي:</label><input type="text" id="motherFullName" class="enter-nav" placeholder="اكتب الاسم واضغط المسطرة..."><div class="split-container"><input type="text" id="mo1" readonly placeholder="الأول"><input type="text" id="mo2" readonly placeholder="الثاني"><input type="text" id="mo3" readonly placeholder="الثالث"><input type="text" id="mo4" readonly placeholder="الرابع"></div></div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
            <div class="form-group"><label>رقم الموبايل:</label><input type="text" id="mobile" class="enter-nav" maxlength="11" style="font-family: Arial; text-align: center;"></div>
            <div class="form-group"><label>الرقم القومي للتلميذ:</label><input type="text" id="studentNid" class="enter-nav" maxlength="14" style="font-family: Arial; text-align: center;"></div>
            <div class="form-group"><label>الرقم القومي للأب:</label><input type="text" id="fatherNid" class="enter-nav" maxlength="14" style="font-family: Arial; text-align: center;"></div>
            <div class="form-group"><label>الرقم القومي للأم:</label><input type="text" id="motherNid" class="enter-nav" maxlength="14" style="font-family: Arial; text-align: center;"></div>
        </div>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
            <div class="form-group"><label>الديانة:</label><select id="religion" class="enter-nav"><option value="مسلم">مسلم</option><option value="مسيحي">مسيحي</option><option value="أخرى">أخرى</option></select></div>
            <div class="form-group"><label>المرحلة:</label><select id="stage" class="enter-nav"><option value="مدرسة">مدرسة</option><option value="رياض أطفال">رياض أطفال</option></select></div>
            <div class="form-group"><label>حالة التسجيل:</label><select id="status" class="enter-nav"><option value="غير مسجل">غير مسجل</option><option value="مسجل">مسجل</option></select></div>
        </div>

        <button id="submitBtn" class="btn-submit enter-nav" onclick="saveData()"><i class="fa-solid fa-save"></i> إدخال وحفظ البيانات (Enter)</button>

        <!-- الإحصائيات -->
        <div class="stats-dashboard">
            <div class="stat-box" style="border-top-color: var(--primary-color);">المدرسة<br><span>مسجل: <span id="sReg" class="stat-val">0</span> | غير مسجل: <span id="sUnreg" class="stat-val">0</span></span></div>
            <div class="stat-box" style="border-top-color: var(--secondary-color);">رياض أطفال<br><span>مسجل: <span id="kReg" class="stat-val">0</span> | غير مسجل: <span id="kUnreg" class="stat-val">0</span></span></div>
            <div class="stat-box" style="border-top-color: var(--success);">الإجمالي الكلي<br><span id="totalCount" class="stat-val" style="font-size:24px; color:var(--text-main);">0</span></div>
        </div>

        <!-- أزرار التصدير الذكية -->
        <div class="export-group">
            <button class="btn-csv" onclick="exportFilteredData('مدرسة', 'csv')"><i class="fa-solid fa-file-csv"></i> تصدير مدرسة (CSV)</button>
            <button class="btn-excel" onclick="exportFilteredData('مدرسة', 'excel')"><i class="fa-solid fa-file-excel"></i> تصدير مدرسة (Excel)</button>
            <button class="btn-csv" onclick="exportFilteredData('رياض أطفال', 'csv')"><i class="fa-solid fa-file-csv"></i> تصدير رياض (CSV)</button>
            <button class="btn-excel" onclick="exportFilteredData('رياض أطفال', 'excel')"><i class="fa-solid fa-file-excel"></i> تصدير رياض (Excel)</button>
        </div>

        <h3 style="margin-top: 30px; color: var(--primary-color); border-bottom: 2px solid var(--border-color); padding-bottom: 10px;"><i class="fa-solid fa-users-viewfinder"></i> جميع البيانات المسجلة</h3>
        
        <!-- الحاوية القابلة للتمرير للجدول -->
        <div class="table-wrapper">
            <table>
                <thead><tr><th>اسم الطالب</th><th>المرحلة</th><th>الحالة</th><th>القومي للطالب</th><th>إجراء</th></tr></thead>
                <tbody id="dataTableBody"></tbody>
            </table>
        </div>
        
        <!-- زر مسح البيانات المحمي بكلمة مرور -->
        <button onclick="clearServerData()" class="btn-clear-db">
            <i class="fa-solid fa-trash-can"></i> مسح قاعدة البيانات (يتطلب كلمة مرور)
        </button>
    </div>

    <script>
        // ================= إعدادات Supabase =================
        const supabaseUrl = 'https://xgsyktjoerrymqoutqcb.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhnc3lrdGpvZXJyeW1xb3V0cWNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NzI2OTUsImV4cCI6MjA5OTA0ODY5NX0.fVdQnU8lQnacNzDTNXtAODbV3Jbgq5ACg5KIw0HFYLM';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        
        const TABLE_NAME = 'primary_registration'; // اسم الجدول في Supabase
        
        let studentsData = [];
        let currentEditId = null;

        // تقسيم الأسماء
        function setupSplitter(mainId, ids) {
            document.getElementById(mainId).addEventListener('input', function() {
                let words = this.value.replace(/\s+/g, ' ').trimStart().split(' ');
                for (let i=0; i<ids.length; i++) document.getElementById(ids[i]).value = words[i] || '';
            });
        }
        setupSplitter('studentFullName', ['st1', 'st2', 'st3', 'st4', 'st5']);
        setupSplitter('motherFullName', ['mo1', 'mo2', 'mo3', 'mo4']);

        // التنقل بالإنتر
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const f = Array.from(document.querySelectorAll('.enter-nav'));
                const i = f.indexOf(document.activeElement);
                if (i > -1 && i < f.length - 1) f[i + 1].focus();
                else if (i === f.length - 1) document.getElementById('submitBtn').click();
            }
        });

        // جلب البيانات وحساب الإحصائيات (Supabase)
        async function loadDataFromServer() {
            try {
                const { data, error } = await supabaseClient.from(TABLE_NAME).select('*').order('created_at', { ascending: false });
                if (error) throw error;
                
                studentsData = data || [];
                updateTable();
                updateDashboard();
            } catch (err) { console.error("خطأ في جلب البيانات:", err); }
        }

        function updateDashboard() {
            let sr=0, su=0, kr=0, ku=0;
            studentsData.forEach(s => {
                if(s.c17 === 'مدرسة') { s.status === 'مسجل' ? sr++ : su++; }
                if(s.c17 === 'رياض أطفال') { s.status === 'مسجل' ? kr++ : ku++; }
            });
            document.getElementById('sReg').innerText = sr; document.getElementById('sUnreg').innerText = su;
            document.getElementById('kReg').innerText = kr; document.getElementById('kUnreg').innerText = ku;
            document.getElementById('totalCount').innerText = studentsData.length;
        }

        // حفظ وتحديث البيانات (Supabase)
      // حفظ وتحديث البيانات (Supabase)
        async function saveData() {
            const studentName = document.getElementById('studentFullName').value.trim();
            const studentNidVal = document.getElementById('studentNid').value.trim();
            const fatherNidVal = document.getElementById('fatherNid').value.trim();
            const motherNidVal = document.getElementById('motherNid').value.trim();

            if(!studentName) { alert("أدخل اسم الطالب!"); return; }

            // 1. التحقق من أن الأرقام القومية تتكون من 14 رقماً بالضبط
            const nidRegex = /^\d{14}$/; 
            if (!nidRegex.test(studentNidVal)) {
                alert("عفواً.. الرقم القومي للتلميذ يجب أن يتكون من 14 رقماً!");
                document.getElementById('studentNid').focus();
                return;
            }
            if (!nidRegex.test(fatherNidVal)) {
                alert("عفواً.. الرقم القومي للأب يجب أن يتكون من 14 رقماً!");
                document.getElementById('fatherNid').focus();
                return;
            }
            if (!nidRegex.test(motherNidVal)) {
                alert("عفواً.. الرقم القومي للأم يجب أن يتكون من 14 رقماً!");
                document.getElementById('motherNid').focus();
                return;
            }

            // 2. التحقق من عدم تكرار الرقم القومي للطالب في قاعدة البيانات
            const isDuplicate = studentsData.some(student => {
                if (currentEditId) {
                    // تم حل المشكلة هنا: توحيد نوع البيانات كنص (String) لضمان المقارنة الصحيحة
                    return student.c13 === studentNidVal && String(student.id) !== String(currentEditId);
                } else {
                    return student.c13 === studentNidVal;
                }
            });

            if (isDuplicate) {
                alert("تنبيه: هذا الرقم القومي للتلميذ مسجل مسبقاً في النظام لطالب آخر!");
                document.getElementById('studentNid').focus();
                return;
            }

            // 3. رسالة تحذيرية لتأكيد التعديل أو الإلغاء (بناءً على طلبك)
            if (currentEditId) {
                const confirmEdit = confirm("أنت تقوم الآن بتعديل بيانات تلميذ مضاف مسبقاً.. هل تريد حفظ التعديلات؟\n\n- اضغط (موافق / OK) لحفظ التعديل.\n- اضغط (إلغاء / Cancel) للتراجع.");
                if (!confirmEdit) {
                    return; // إيقاف العملية إذا اختار المستخدم إلغاء
                }
            }

            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...'; 
            btn.disabled = true;

            const record = {
                c1: studentName, c2: document.getElementById('st1').value, c3: document.getElementById('st2').value, c4: document.getElementById('st3').value, c5: document.getElementById('st4').value, c6: document.getElementById('st5').value,
                c7: document.getElementById('motherFullName').value, c8: document.getElementById('mo1').value, c9: document.getElementById('mo2').value, c10: document.getElementById('mo3').value, c11: document.getElementById('mo4').value,
                c12: document.getElementById('mobile').value, c13: studentNidVal, c14: fatherNidVal, c15: motherNidVal,
                c16: document.getElementById('religion').value, c17: document.getElementById('stage').value, status: document.getElementById('status').value
            };

            try {
                if (currentEditId) {
                    // تحديث سجل موجود
                    const { error } = await supabaseClient.from(TABLE_NAME).update(record).eq('id', currentEditId);
                    if (error) throw error;
                    currentEditId = null;
                } else {
                    // إضافة سجل جديد
                    const { error } = await supabaseClient.from(TABLE_NAME).insert([record]);
                    if (error) throw error;
                }
                await loadDataFromServer();
                clearForm();
            } catch (err) { alert("خطأ في الحفظ: " + err.message); } 
            finally {
                btn.innerHTML = '<i class="fa-solid fa-save"></i> إدخال وحفظ البيانات (Enter)'; 
                btn.disabled = false;
                document.getElementById('studentFullName').focus();
            }
        }

        function editRecord(id) {
            const r = studentsData.find(s => s.id == id);
            if(!r) return;
            
            document.getElementById('studentFullName').value = r.c1 || '';
            document.getElementById('st1').value = r.c2 || ''; document.getElementById('st2').value = r.c3 || ''; document.getElementById('st3').value = r.c4 || ''; document.getElementById('st4').value = r.c5 || ''; document.getElementById('st5').value = r.c6 || '';
            document.getElementById('motherFullName').value = r.c7 || '';
            document.getElementById('mo1').value = r.c8 || ''; document.getElementById('mo2').value = r.c9 || ''; document.getElementById('mo3').value = r.c10 || ''; document.getElementById('mo4').value = r.c11 || '';
            document.getElementById('mobile').value = r.c12 || ''; document.getElementById('studentNid').value = r.c13 || ''; document.getElementById('fatherNid').value = r.c14 || ''; document.getElementById('motherNid').value = r.c15 || '';
            document.getElementById('religion').value = r.c16 || 'مسلم'; document.getElementById('stage').value = r.c17 || 'مدرسة'; document.getElementById('status').value = r.status || 'غير مسجل';

            currentEditId = id;
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> تحديث البيانات (Enter)';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateTable() {
            const tbody = document.getElementById('dataTableBody'); tbody.innerHTML = '';
            
            // عرض جميع البيانات
            studentsData.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${r.c1}</td><td>${r.c17}</td><td style="color:${r.status==='مسجل'?'var(--success)':'var(--danger)'}; font-weight:900;">${r.status}</td><td style="font-family:Arial;">${r.c13}</td>
                <td><button class="btn-edit" onclick="editRecord('${r.id}')"><i class="fa-solid fa-pen"></i> تعديل</button></td>`;
                tbody.appendChild(tr);
            });
        }

        function clearForm() {
            document.querySelectorAll('input[type="text"]').forEach(i => i.value = '');
            document.getElementById('religion').value = 'مسلم'; document.getElementById('stage').value = 'مدرسة'; document.getElementById('status').value = 'غير مسجل';
            currentEditId = null; document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-save"></i> إدخال وحفظ البيانات (Enter)';
        }

        // مسح البيانات (Supabase)
        async function clearServerData() {
            const pass = prompt('الرجاء إدخال كلمة المرور لمسح قاعدة البيانات:');
            
            if (pass === '2026') {
                if(confirm('تحذير نهائي: هل أنت متأكد من مسح جميع البيانات؟ لا يمكن التراجع عن هذا الإجراء.')) {
                    try {
                        const { error } = await supabaseClient.from(TABLE_NAME).delete().not('c1', 'is', null);
                        if (error) throw error;
                        
                        studentsData = [];
                        updateTable();
                        updateDashboard();
                        alert('✅ تم مسح جميع البيانات بنجاح.');
                    } catch (err) {
                        alert('❌ حدث خطأ أثناء المسح: ' + err.message);
                    }
                }
            } else if (pass !== null) {
                alert('كلمة المرور خاطئة! تم إلغاء عملية المسح للحفاظ على البيانات.');
            }
        }

        async function exportFilteredData(stageTarget, format) {
            await loadDataFromServer(); 
            const filteredData = studentsData.filter(s => s.c17 === stageTarget);
            if (filteredData.length === 0) { alert(`لا توجد بيانات مرحلة (${stageTarget}) لتصديرها`); return; }

            if (format === 'csv') {
                // ================= التعديل هنا =================
                // تصفية البيانات لتشمل فقط من حالتهم "غير مسجل"
                const unregisteredData = filteredData.filter(s => s.status === 'غير مسجل');
                
                if (unregisteredData.length === 0) {
                    alert(`جميع الطلاب في مرحلة (${stageTarget}) مسجلين بالفعل.. لا يوجد بيانات (غير مسجل) لتصديرها.`);
                    return;
                }
                // ===============================================

                // 1. عناوين الأعمدة كما يطلبها Katalon Recorder
                const csvHeaders = [
                    "Column1", "Column2", "Column3", "Column4", "Column5", 
                    "Column6", "Column7", "Column8", "Column9", "Column10", 
                    "Column11", "Column12", "Column13", "Column14", "Column15"
                ];

                const csvRows = [csvHeaders];

                // 2. ترتيب البيانات لغير المسجلين فقط
                unregisteredData.forEach(r => {
                    csvRows.push([
                        r.c2,  // Column1: الاسم الاول
                        r.c3,  // Column2: الاسم الثانى
                        r.c4,  // Column3: الاسم الثالث
                        r.c5,  // Column4: الاسم الرابع
                        r.c6,  // Column5: الاسم الخامس
                        r.c8,  // Column6: اسم الام الاول
                        r.c9,  // Column7: اسم الام الثانى
                        r.c10, // Column8: اسم الام الثالث
                        r.c11, // Column9: اسم الام الرابع
                        r.c13, // Column10: الرقم القومى للطالب
                        r.c14, // Column11: الرقم القومى للاب
                        r.c15, // Column12: الرقم القومى للام
                        r.c12, // Column13: رقم الموبايل
                        "",    // Column14: فارغ
                        ""     // Column15: فارغ
                    ]);
                });

                // 3. دمج البيانات بفاصلة (,) بدلاً من (;) ليتعرف عليها Katalon كعمود واحد قياسي
                let csvContent = csvRows.map(row => row.map(item => `"${item || ''}"`).join(",")).join("\n");
                
                // 4. إنشاء وتحميل الملف
                const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `Katalon_Data_${stageTarget}_Unregistered.csv`; // تم تعديل اسم الملف للتوضيح
                link.click();
            } 
            else if (format === 'excel') {
                // بقاء ملف الإكسل كما هو بالشكل الطبيعي (يطبع الكل مسجل وغير مسجل)
                const excelHeaders = [
                    "اسم التلميذ الخماسي", "الاسم الأول", "الاسم الثاني", "الاسم الثالث", "الاسم الرابع", "الاسم الخامس", 
                    "اسم الأم الرباعي", "اسم الأم الأول", "اسم الأم الثاني", "اسم الأم الثالث", "اسم الأم الرابع", 
                    "رقم الموبايل", "الرقم القومي للطالب", "الرقم القومي للأب", "الرقم القومي للأم", "الديانة", "المرحلة", "حالة التسجيل"
                ];

                const excelRows = [excelHeaders];
                filteredData.forEach(r => {
                    excelRows.push([
                        r.c1, r.c2, r.c3, r.c4, r.c5, r.c6, 
                        r.c7, r.c8, r.c9, r.c10, r.c11, 
                        r.c12, r.c13, r.c14, r.c15, r.c16, r.c17, r.status
                    ]);
                });

                const worksheet = XLSX.utils.aoa_to_sheet(excelRows);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, stageTarget);
                XLSX.writeFile(workbook, `Data_${stageTarget}_All.xlsx`);
            }
        }

        window.onload = loadDataFromServer;
    </script>
</body>
</html>
