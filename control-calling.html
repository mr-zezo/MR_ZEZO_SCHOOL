<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كشوف المناداة - كنترول مستر زيزو</title>
    
    <!-- خط Cairo والأيقونات الرسمية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase & SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #0f2b48;
            --primary-light: #1e3a8a;
            --gold: #d97706;
            --bg: #f8fafc;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px; }

        .app-container { width: 100%; max-width: 1100px; }

        .top-nav {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white; border-bottom: 4px solid var(--gold);
        }

        .btn-3d {
            border-bottom: 3.5px solid rgba(0,0,0,0.25);
            transition: all 0.15s ease;
            touch-action: manipulation;
        }
        .btn-3d:active { transform: translateY(2px); border-bottom-width: 1px; }

        /* ================= تنسيقات الطباعة (مطابقة للصورة المرفقة) ================= */
        #print-area { width: 100%; display: flex; flex-direction: column; gap: 20px; align-items: center; }
        
        .committee-sheet {
            width: 210mm; /* عرض A4 */
            min-height: 297mm; /* طول A4 */
            background: white;
            padding: 15mm;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid #ccc;
            margin-bottom: 20px;
            display: none; /* مخفي حتى يتم التوليد */
            flex-direction: column;
        }

        /* ترويسة الكشف المطابقة للصورة */
        .header-table {
            width: 100%;
            border-collapse: collapse;
            border: 3px solid #000;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 900;
            font-size: 15px;
            color: #000;
        }
        .header-table td {
            border: 2px solid #000;
            padding: 6px;
            vertical-align: middle;
        }
        .header-table .col-right { width: 40%; text-align: right; padding-right: 15px; }
        .header-table .col-center { width: 40%; font-size: 18px; }
        .header-table .col-left { width: 20%; }
        .header-table .stat-label { width: 50%; border-left: 2px solid #000; }
        .header-table .stat-val { width: 50%; font-family: Arial, sans-serif; font-size: 16px; }

        /* جدول الأسماء المطابق للصورة */
        .students-table {
            width: 100%;
            border-collapse: collapse;
            border: 3px solid #000;
            text-align: center;
            font-weight: 900;
            color: #000;
        }
        .students-table th {
            background-color: #f2f2f2;
            border: 2px solid #000;
            padding: 8px;
            font-size: 15px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .students-table td {
            border: 2px solid #000;
            padding: 6px;
            font-size: 14px;
            height: 32px;
        }
        .students-table .col-m { width: 40px; font-family: Arial, sans-serif; }
        .students-table .col-name { text-align: right; padding-right: 10px; font-size: 15px; }
        .students-table .col-seat { width: 90px; font-family: Arial, sans-serif; font-size: 15px; }
        .students-table .col-rel { width: 70px; }
        .students-table .col-dmj { width: 70px; }

        .sheet-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-weight: 900;
            font-size: 15px;
            color: #000;
            padding: 0 10px;
        }

        @media print {
            @page { size: A4 portrait; margin: 0; }
            body { background: white !important; padding: 0 !important; }
            .no-print { display: none !important; }
            .app-container { max-width: 100% !important; width: 100% !important; }
            #print-area { gap: 0; }
            .committee-sheet {
                box-shadow: none; border: none; margin: 0; padding: 10mm;
                page-break-after: always; display: flex !important;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 1. الشريط العلوي -->
        <header class="top-nav rounded-2xl shadow-lg p-3 sm:p-4 mb-4 flex flex-wrap justify-between items-center gap-3 no-print">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-amber-500/20 border border-amber-400/40 flex items-center justify-center text-yellow-300 text-2xl shrink-0">
                    <i class="fa-solid fa-id-card-clip"></i>
                </div>
                <div>
                    <h1 class="text-sm sm:text-base font-black leading-tight text-white flex items-center gap-2">
                        كشوف المناداة للجان
                    </h1>
                    <p class="text-[11px] text-blue-200 font-bold">بوابة الكنترول المدرسي • مستر زيزو</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <a href="control-index.html" class="btn-3d px-3.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-white font-black rounded-xl text-xs flex items-center gap-1.5 shadow">
                    <i class="fa-solid fa-stamp"></i> بوابة الكنترول
                </a>
                <a href="index.html" class="btn-3d px-3.5 py-1.5 bg-blue-800 hover:bg-blue-700 text-white font-black rounded-xl text-xs flex items-center gap-1.5 shadow">
                    <i class="fa-solid fa-house"></i> الرئيسية
                </a>
            </div>
        </header>

        <!-- 2. لوحة التحكم والإعدادات -->
        <div class="bg-white border border-slate-200 rounded-2xl p-4 mb-4 shadow-sm no-print space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                
                <div>
                    <label class="block text-xs font-black text-slate-700 mb-1">الصف الدراسي:</label>
                    <select id="sel-grade" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-black outline-none">
                        <option value="الأول">الصف الأول</option>
                        <option value="الثاني">الصف الثاني</option>
                        <option value="الثالث">الصف الثالث</option>
                        <option value="الرابع" selected>الصف الرابع</option>
                        <option value="الخامس">الصف الخامس</option>
                        <option value="السادس">الصف السادس</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-black text-slate-700 mb-1">امتحان الفصل الدراسي:</label>
                    <select id="sel-term" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-black outline-none">
                        <option value="t1">الترم الأول (نصف العام)</option>
                        <option value="t2">الترم الثاني (آخر العام)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-black text-slate-700 mb-1">اسم الامتحان (للطباعة):</label>
                    <input type="text" id="inp-exam-name" value="امتحان نصف العام" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-black outline-none">
                </div>

                <div>
                    <label class="block text-xs font-black text-slate-700 mb-1">العام الدراسي:</label>
                    <input type="text" id="inp-year" value="٢٠٢٦ / ٢٠٢٧" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-black outline-none text-center">
                </div>

            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-slate-100">
                <div>
                    <label class="block text-xs font-black text-slate-700 mb-1">اسم مدير المدرسة:</label>
                    <input type="text" id="inp-manager" value="أ / أشرف عبدالستار" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-black outline-none">
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-700 mb-1">اسم رئيس الكنترول:</label>
                    <input type="text" id="inp-control-head" value="أ / خالد عمارة" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-black outline-none">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button onclick="generateCallingLists()" class="btn-3d px-5 py-2.5 bg-[#0f2b48] hover:bg-[#1e3a8a] text-white rounded-xl text-sm font-black flex items-center gap-2 shadow">
                    <i class="fa-solid fa-wand-magic-sparkles text-yellow-300"></i> توليد كشوف المناداة
                </button>
                <button onclick="window.print()" id="btn-print" style="display:none;" class="btn-3d px-5 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl text-sm font-black flex items-center gap-2 shadow">
                    <i class="fa-solid fa-print text-emerald-200"></i> طباعة الكشوف
                </button>
            </div>
        </div>

        <!-- 3. منطقة عرض الأوراق للطباعة -->
        <div id="print-area">
            <div class="text-center p-10 text-slate-400 font-bold no-print">
                <i class="fa-solid fa-id-card-clip text-4xl mb-3 opacity-50"></i><br>
                حدد الصف والترم واضغط "توليد كشوف المناداة" لعرض الأوراق هنا...
            </div>
        </div>

    </div>

    <!-- المحرك البرمجي -->
    <script>
        const SUPABASE_URL = "https://xgsyktjoerrymqoutqcb.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhnc3lrdGpvZXJyeW1xb3V0cWNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NzI2OTUsImV4cCI6MjA5OTA0ODY5NX0.fVdQnU8lQnacNzDTNXtAODbV3Jbgq5ACg5KIw0HFYLM";
        const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const DB_NAME = "MR_ZEZO_SCHOOL_OFFLINE_DB";
        const DB_VERSION = 2;

        const toAr = n => (n === 0 ? "٠" : (!n && n !== 0 ? "-" : String(n).replace(/[0-9]/g, w => ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][w])));

        // تحديث اسم الامتحان تلقائياً عند تغيير الترم
        document.getElementById('sel-term').addEventListener('change', function() {
            const examInput = document.getElementById('inp-exam-name');
            if (this.value === 't1') examInput.value = "امتحان نصف العام";
            else examInput.value = "امتحان آخر العام";
        });

        function openLocalDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function generateCallingLists() {
            const grade = document.getElementById("sel-grade").value;
            const term = document.getElementById("sel-term").value;
            const examName = document.getElementById("inp-exam-name").value;
            const year = document.getElementById("inp-year").value;
            const manager = document.getElementById("inp-manager").value;
            const controlHead = document.getElementById("inp-control-head").value;
            const printArea = document.getElementById("print-area");

            const capsuleKey = `control_master_grade_${grade}`;
            
            Swal.fire({ title: 'جاري سحب بيانات الكنترول وتجهيز اللجان...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                let studentsData = null;
                const mode = localStorage.getItem('ZEZO_APP_MODE') || 'online';

                if (mode === 'offline') {
                    const db = await openLocalDB();
                    studentsData = await new Promise((resolve) => {
                        const tx = db.transaction('system_capsules', 'readonly');
                        const req = tx.objectStore('system_capsules').get(capsuleKey);
                        req.onsuccess = () => resolve(req.result ? req.result.data : null);
                        req.onerror = () => resolve(null);
                    });
                } else {
                    const { data } = await sbClient.from("system_capsules").select("data").eq("id", capsuleKey).maybeSingle();
                    if (data && data.data) studentsData = data.data;
                }

                if (!studentsData || studentsData.length === 0) {
                    Swal.fire('تنبيه', `لم يتم العثور على شيت كنترول معتمد للصف (${grade}). يرجى إعداده من الشيت المركزي أولاً.`, 'warning');
                    return;
                }

                // تحديد حقول اللجان والجلوس بناءً على الترم المختار
                const commField = term === 't1' ? 'comm_t1' : 'comm_t2';
                const seatField = term === 't1' ? 'seat_t1' : 'seat_t2';

                // تصفية الطلاب الذين لديهم رقم لجنة ورقم جلوس
                let validStudents = studentsData.filter(s => s[commField] && s[seatField]);

                if (validStudents.length === 0) {
                    Swal.fire('تنبيه', `لم يتم توزيع أرقام جلوس أو لجان لهذا الترم في شيت الكنترول!`, 'warning');
                    return;
                }

                // تجميع الطلاب حسب رقم اللجنة
                const committeesMap = new Map();
                validStudents.forEach(s => {
                    const cNum = parseInt(s[commField]);
                    if (!committeesMap.has(cNum)) committeesMap.set(cNum, []);
                    committeesMap.get(cNum).push(s);
                });

                // ترتيب اللجان تصاعدياً
                const sortedCommittees = Array.from(committeesMap.keys()).sort((a, b) => a - b);

                printArea.innerHTML = ""; // تفريغ منطقة الطباعة

                // بناء ورقة لكل لجنة
                sortedCommittees.forEach(cNum => {
                    let committeeStudents = committeesMap.get(cNum);
                    
                    // ترتيب الطلاب داخل اللجنة برقم الجلوس
                    committeeStudents.sort((a, b) => parseInt(a[seatField]) - parseInt(b[seatField]));

                    // حساب الإحصائيات
                    const totalCount = committeeStudents.length;

                    // استخدام includes لتجاوز مشكلة (ي / ى) والمسافات في كلمة مسيحي
                    const christianCount = committeeStudents.filter(s => String(s.religion).includes('مسيح')).length;

                    // تأمين إحصاء الدمج أيضاً بنفس الطريقة
                    const damjCount = committeeStudents.filter(s => String(s.dmj).includes('دمج')).length;

                    // بناء صفوف الطلاب
                    let rowsHtml = "";
                    committeeStudents.forEach((st, idx) => {
                        rowsHtml += `
                            <tr>
                                <td class="col-m">${idx + 1}</td>
                                <td class="col-name">${st.name}</td>
                                <td class="col-seat">${st[seatField]}</td>
                                <td class="col-rel">${st.religion}</td>
                                <td class="col-dmj">${st.dmj === 'دمج' ? 'دمج' : ''}</td>
                            </tr>
                        `;
                    });

                    // بناء الورقة (مطابقة للصورة المرفقة)
                    const sheetHtml = `
                        <div class="committee-sheet" style="display: flex;">
                            
                            <!-- الترويسة العلوية -->
                            <table class="header-table">
                                <tr>
                                    <td class="col-right">مدرسة الشهيد أشرف حبيب</td>
                                    <td class="col-center">الصف ${grade.replace('الصف ', '')}</td>
                                    <td class="col-left" style="padding:0;">
                                        <table style="width:100%; height:100%; border-collapse:collapse;">
                                            <tr><td class="stat-label">العدد</td><td class="stat-val">${totalCount}</td></tr>
                                        </table>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="col-right">${examName}</td>
                                    <td class="col-center" rowspan="2" style="font-size:22px;">لجنة رقم <span style="font-family:Arial; margin-right:10px;">${cNum}</span></td>
                                    <td class="col-left" style="padding:0;">
                                        <table style="width:100%; height:100%; border-collapse:collapse;">
                                            <tr><td class="stat-label">مسيحى</td><td class="stat-val">${christianCount > 0 ? christianCount : '-'}</td></tr>
                                        </table>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="col-right">العام الدراسى &nbsp; ${year}</td>
                                    <td class="col-left" style="padding:0;">
                                        <table style="width:100%; height:100%; border-collapse:collapse;">
                                            <tr><td class="stat-label">دمج</td><td class="stat-val">${damjCount > 0 ? damjCount : '-'}</td></tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>

                            <!-- جدول الأسماء -->
                            <table class="students-table">
                                <thead>
                                    <tr>
                                        <th class="col-m">م</th>
                                        <th class="col-name" style="text-align:center;">الاسم</th>
                                        <th class="col-seat">رقم الجلوس</th>
                                        <th class="col-rel">الديانة</th>
                                        <th class="col-dmj">دمج</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rowsHtml}
                                </tbody>
                            </table>

                            <!-- التذييل -->
                            <div class="sheet-footer">
                                <div>رئيس الكنترول ${controlHead}</div>
                                <div>مدير المدرسة ${manager}</div>
                            </div>
                        </div>
                    `;

                    printArea.innerHTML += sheetHtml;
                });

                document.getElementById("btn-print").style.display = "flex";
                Swal.close();

            } catch (err) {
                console.error(err);
                Swal.fire('خطأ', 'حدث خطأ أثناء توليد الكشوف: ' + err.message, 'error');
            }
        }
    </script>
</body>
</html>
