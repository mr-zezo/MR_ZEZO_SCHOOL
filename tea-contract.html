<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>غرفة عمليات الجدول (موبايل)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root { 
            --primary-color: #1e3a8a; --secondary-color: #d97706; --bg-color: #f8fafc; 
            --text-main: #0f172a; --danger: #be123c; --success: #16a34a; 
            --warning: #f59e0b; --border-color: #cbd5e1; --contract-color: #4338ca;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* الشريط العلوي */
        .top-nav { background: var(--primary-color); padding: 10px 15px; color: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 100; flex-shrink: 0;}
        .top-nav h1 { font-size: 16px; font-weight: 900; color: #fcd34d; margin: 0; display: flex; align-items: center; gap: 8px;}
        .top-nav .nav-actions { display: flex; gap: 10px; }
        .icon-btn { background: rgba(255,255,255,0.2); color: white; border: none; width: 35px; height: 35px; border-radius: 8px; font-size: 16px; display: flex; justify-content: center; align-items: center; cursor: pointer; }

        /* شريط التحكم */
        .controls-bar { padding: 10px; background: white; display: flex; gap: 10px; border-bottom: 2px solid var(--border-color); z-index: 99; flex-shrink: 0;}
        .day-selector { flex-grow: 1; padding: 10px; font-size: 15px; font-weight: 900; border-radius: 8px; border: 2px solid var(--primary-color); outline: none; color: var(--primary-color); text-align: center; background: #eff6ff;}
        .btn-save-cloud { background: var(--success); color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: 900; font-size: 14px; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 6px rgba(22, 163, 74, 0.3);}

        /* شريط التعليمات */
        .instruction-bar { background: #fffbeb; color: #b45309; padding: 8px 10px; text-align: center; font-size: 12px; font-weight: 900; border-bottom: 1px solid #fde68a; flex-shrink: 0; transition: 0.3s;}
        .instruction-bar.active-swap { background: var(--primary-color); color: white; }

        /* الجدول */
        .table-container { flex-grow: 1; overflow: auto; background: white; padding-bottom: 60px; }
        .interactive-table { border-collapse: separate; border-spacing: 0; width: max-content; }
        .interactive-table th, .interactive-table td { border-bottom: 1px solid var(--border-color); border-left: 1px solid var(--border-color); padding: 0; text-align: center; }
        .interactive-table thead th { position: sticky; top: 0; background: var(--primary-color); color: white; z-index: 10; padding: 10px; font-size: 14px; min-width: 65px; border-bottom: 2px solid #0f172a;}
        
        .interactive-table tbody th { position: sticky; right: 0; background: #f8fafc; color: var(--primary-color); z-index: 5; font-size: 13px; font-weight: 900; padding: 0 10px; text-align: right; min-width: 140px; max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid var(--border-color); box-shadow: -2px 0 5px rgba(0,0,0,0.05);}
        .interactive-table thead th:first-child { position: sticky; right: 0; z-index: 20; background: #0f172a; border-left: 2px solid var(--border-color);}

        .badge-contract { font-size: 10px; background: var(--contract-color); color: white; padding: 2px 5px; border-radius: 4px; margin-right: 5px; font-weight: normal; }
        .subj-label { font-size: 10px; color: #64748b; display: block; margin-top: -3px; }

        /* الخلايا */
        .cell-btn { width: 100%; height: 55px; background: transparent; border: none; font-size: 16px; font-weight: 900; outline: none; display: flex; justify-content: center; align-items: center; transition: 0.1s; }
        .cell-btn.has-class { color: var(--primary-color); }
        .cell-btn:active { background: #e2e8f0; }
        .cell-btn.selected-swap { background: var(--warning) !important; color: white !important; box-shadow: inset 0 0 0 3px #b45309; animation: pulse 1s infinite; }
        .cell-btn.conflict { background: #fee2e2 !important; color: red !important; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        /* الرادار السفلي */
        .radar-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; box-shadow: 0 -4px 15px rgba(0,0,0,0.1); z-index: 1000; border-top-left-radius: 15px; border-top-right-radius: 15px; transition: 0.3s transform; display: flex; flex-direction: column; max-height: 70vh;}
        .radar-summary { padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-size: 15px; cursor: pointer; background: var(--text-main); color: white; border-top-left-radius: 15px; border-top-right-radius: 15px; }
        .radar-badges { display: flex; gap: 10px; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; background: rgba(255,255,255,0.2); }
        .badge.err { background: var(--danger); }
        .badge.warn { background: var(--warning); color: black;}
        .badge.ok { background: var(--success); }
        .radar-details { overflow-y: auto; padding: 15px; display: none; background: #f8fafc; gap: 8px; flex-direction: column; }
        .radar-bar.expanded .radar-details { display: flex; }
        .alert-box { padding: 10px; border-radius: 8px; font-size: 13px; font-weight: bold; display: flex; align-items: flex-start; gap: 8px; line-height: 1.4; }
        .alert-danger { background: #fef2f2; color: var(--danger); border: 1px solid #fecdd3; }
        .alert-warning { background: #fffbeb; color: var(--secondary-color); border: 1px solid #fde68a; }

        /* نافذة التعديل السريع اليدوي */
        .bottom-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; display: none; flex-direction: column; justify-content: flex-end; }
        .bottom-modal-content { background: white; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 25px 20px; text-align: center; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .qe-title { font-size: 16px; font-weight: 900; color: var(--primary-color); margin-bottom: 10px; }
        .qe-hint { font-size: 12px; color: #64748b; margin-bottom: 15px; font-weight: bold; }
        
        .qe-input { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid var(--primary-color); font-weight: 900; margin-bottom: 20px; font-size: 22px; text-align: center; outline: none; background: #f8fafc; direction: ltr; color: var(--primary-color);}
        .qe-input:focus { background: white; box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.1); }
        
        .qe-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .qe-btn { padding: 12px; border: none; border-radius: 10px; font-weight: 900; font-size: 15px; color: white; display: flex; justify-content: center; align-items: center; gap: 8px;}
        .qe-save { background: var(--primary-color); grid-column: 1 / -1; }
        .qe-delete { background: var(--danger); }
        .qe-cancel { background: #64748b; }

    </style>
</head>
<body>

    <div class="top-nav">
        <h1><i class="fa-solid fa-mobile-screen"></i> مدير الجدول</h1>
        <div class="nav-actions">
            <button class="icon-btn" onclick="window.location.reload()"><i class="fa-solid fa-rotate-right"></i></button>
            <a href="schedule.html" class="icon-btn" style="text-decoration:none; background: var(--secondary-color);" title="العودة للجدول العادي"><i class="fa-solid fa-table-cells"></i></a>
            <a href="index.html" class="icon-btn" style="text-decoration:none;"><i class="fa-solid fa-house"></i></a>
        </div>
    </div>

    <div class="controls-bar">
        <select class="day-selector" id="day-select" onchange="renderGrid()">
            <option value="الاحد">يوم الأحد</option>
            <option value="الاثنين">يوم الإثنين</option>
            <option value="الثلاثاء">يوم الثلاثاء</option>
            <option value="الاربعاء">يوم الأربعاء</option>
            <option value="الخميس">يوم الخميس</option>
        </select>
        <button class="btn-save-cloud" onclick="saveAllToCloud()"><i class="fa-solid fa-cloud-arrow-up"></i> حفظ</button>
    </div>

    <div class="instruction-bar" id="instruction-bar">
        👈 ضغطة للتبديل | ضغطتين متتاليتين للتعديل اليدوي السريع
    </div>

    <div class="table-container">
        <table class="interactive-table">
            <thead>
                <tr>
                    <th>المعلم والمادة</th>
                    <th>ح 1</th><th>ح 2</th><th>ح 3</th><th>ح 4</th>
                    <th>ح 5</th><th>ح 6</th><th>ح 7</th><th>ح 8</th>
                </tr>
            </thead>
            <tbody id="grid-body"></tbody>
        </table>
    </div>

    <div class="radar-bar" id="radar-bar">
        <div class="radar-summary" onclick="toggleRadar()">
            <div style="display:flex; align-items:center; gap:8px;">
                <i class="fa-solid fa-satellite-dish" id="radar-icon"></i> حالة الجدول
            </div>
            <div class="radar-badges" id="radar-badges">
                <span class="badge">جاري الفحص...</span>
            </div>
        </div>
        <div class="radar-details" id="radar-details"></div>
    </div>

    <div class="bottom-modal-overlay" id="qeModal" onclick="if(event.target===this) closeQuickEdit()">
        <div class="bottom-modal-content">
            <div class="qe-title" id="qe-title">تعديل الحصة</div>
            <div class="qe-hint">اكتب الأرقام فقط (مثال: اكتب 41 لتصبح ٤/١)</div>
            
            <input type="tel" class="qe-input" id="qe-class-input" placeholder="اكتب رقم الفصل..." oninput="smartFormatInput(this)" onkeypress="if(event.key==='Enter') applyQuickEdit();">
            
            <div class="qe-actions">
                <button class="qe-btn qe-save" onclick="applyQuickEdit()"><i class="fa-solid fa-check"></i> حفظ التعديل</button>
                <button class="qe-btn qe-delete" onclick="clearQuickEdit()"><i class="fa-solid fa-eraser"></i> تفريغ</button>
                <button class="qe-btn qe-cancel" onclick="closeQuickEdit()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://xgsyktjoerrymqoutqcb.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhnc3lrdGpvZXJyeW1xb3V0cWNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NzI2OTUsImV4cCI6MjA5OTA0ODY5NX0.fVdQnU8lQnacNzDTNXtAODbV3Jbgq5ACg5KIw0HFYLM';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const dayNamesAr = {"الاحد":"الأحد", "الاثنين":"الإثنين", "الثلاثاء":"الثلاثاء", "الاربعاء":"الأربعاء", "الخميس":"الخميس"};
        
        let TEACHERS = [];
        let MODIFIED_TEACHERS = new Set();
        let swapState = null; 
        let currentEditData = null;

        window.addEventListener('DOMContentLoaded', async () => {
            await loadData();
        });

        function formatNum(str) {
            if (!str) return "";
            return String(str).replace(/[0-9]/g, w => ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][w]);
        }

        function extractShortName(fullName) {
            if (!fullName) return "غير محدد";
            const parts = fullName.trim().split(/\s+/);
            if(parts.length === 1) return parts[0];
            if (parts[0] === "عبد" || parts[0] === "ابو" || parts[0] === "أبو") return parts[0] + " " + parts[1] + " " + parts[parts.length - 1];
            return parts[0] + " " + parts[parts.length - 1];
        }

        function smartFormatInput(inputElement) {
            let val = inputElement.value;
            let enVal = val.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
            enVal = enVal.replace(/[^0-9/]/g, '');
            if (/^[0-9]{2}$/.test(enVal)) enVal = enVal[0] + '/' + enVal[1];
            inputElement.value = formatNum(enVal);
        }

        // ================= المترجم الذكي لترتيب المواد =================
        const orderedSubjectsKeywords = [
            ["عربي", "لغهاعربيه"],           // 1. عربي
            ["رياضيات", "حساب"],             // 2. رياضيات
            ["انجل", "لغهانجليزيه"],         // 3. إنجليزي
            ["علوم"],                        // 4. علوم
            ["دراس", "اجتماعي"],             // 5. دراسات
            ["حاسب", "كمبيوتر", "تكنولوجيا"],// 6. حاسب آلي
            ["دين"],                         // 7. تربية دينية
            ["فني", "رسم"],                  // 8. تربية فنية
            ["رياضي", "بدني", "العاب"],      // 9. تربية رياضية
            ["موسيقي"],                      // 10. موسيقى
            ["فصل"],                         // 11. معلم فصل
            ["اطفال", "رياض"]                // 12. رياض أطفال
        ];

        function getSubjectRank(subjectString) {
            if (!subjectString) return 999;
            
            // تجريد الكلمة من المسافات والهمزات لتسهيل البحث
            let cleanSubj = subjectString.replace(/[أإآا]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, "");
            
            for (let i = 0; i < orderedSubjectsKeywords.length; i++) {
                const keywords = orderedSubjectsKeywords[i];
                for (let keyword of keywords) {
                    if (cleanSubj.includes(keyword)) {
                        return i; // إرجاع الترتيب إذا وجد تطابق
                    }
                }
            }
            return 999; // إذا كانت المادة غير معروفة تذهب للنهاية
        }

        async function loadData() {
            Swal.fire({ title: 'تحميل بيانات المدرسة...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                const [resTeachers, resContract] = await Promise.all([
                    supabaseClient.from("teachers").select("*").eq("emp_status", "على رأس العمل"),
                    supabaseClient.from("contract_teachers").select("*").eq("status", "يعمل")
                ]);

                if(resTeachers.error) throw resTeachers.error;
                if(resContract.error) throw resContract.error;

                let combinedTeachers = [];

                // 1. فلترة صارمة جداً للمعلمين الأساسيين
                (resTeachers.data || []).forEach(t => {
                    let job = (t.cadre_job || "").replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/\s+/g, "");
                    let subj = (t.subject || "").replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/\s+/g, "");
                    
                    const isNonTeacher = 
                        job.includes("عامل") || 
                        job.includes("اداري") || 
                        job.includes("اخصائي") || 
                        job.includes("مشرف") || 
                        job.includes("سكرتير") || 
                        job.includes("امين") || 
                        job.includes("حارس") || 
                        job.includes("فني") || 
                        job.includes("غيرمخاطب") || 
                        job.includes("خدمات") ||
                        subj.includes("لايوجد") || 
                        subj === ""; 

                    if(!isNonTeacher) {
                        combinedTeachers.push({
                            id: t.code,
                            type: 'regular',
                            name: t.name,
                            short_name: t.short_name || extractShortName(t.name),
                            subject: (t.subject || "غير محدد").trim(),
                            schedule: t.schedule || {}
                        });
                    }
                });

                // 2. إضافة معلمي الأجر
                (resContract.data || []).forEach(t => {
                    combinedTeachers.push({
                        id: t.nid,
                        type: 'contract',
                        name: t.name,
                        short_name: extractShortName(t.name),
                        subject: (t.subject || "غير محدد").trim(),
                        schedule: t.schedule || {}
                    });
                });

                // 3. الترتيب الصارم باستخدام المترجم الذكي
                combinedTeachers.sort((a, b) => {
                    let rankA = getSubjectRank(a.subject);
                    let rankB = getSubjectRank(b.subject);

                    if (rankA !== rankB) return rankA - rankB; // ترتيب حسب المادة
                    return (a.name || "").localeCompare(b.name || "", 'ar'); // ترتيب أبجدي لنفس المادة
                });

                TEACHERS = combinedTeachers;
                renderGrid();
                Swal.close();
            } catch(e) {
                Swal.fire('خطأ', 'فشل تحميل البيانات: ' + e.message, 'error');
            }
        }

        function updateInstructionBar() {
            const bar = document.getElementById("instruction-bar");
            if(swapState) {
                bar.innerHTML = `<i class="fa-solid fa-hand-pointer"></i> تم تحديد حصة من يوم (${dayNamesAr[swapState.day]}).. اذهب لأي يوم واضغط على الحصة البديلة!`;
                bar.classList.add("active-swap");
            } else {
                bar.innerHTML = `👈 ضغطة للتبديل | ضغطتين متتاليتين للتعديل اليدوي السريع`;
                bar.classList.remove("active-swap");
            }
        }

        function renderGrid() {
            const currentDay = document.getElementById("day-select").value;
            const tbody = document.getElementById("grid-body");
            tbody.innerHTML = "";

            TEACHERS.forEach(t => {
                let tr = document.createElement("tr");
                
                let th = document.createElement("th");
                let nameHtml = t.short_name;
                if(t.type === 'contract') nameHtml += ` <span class="badge-contract">أجر</span>`;
                th.innerHTML = `<div>${nameHtml}</div><span class="subj-label">${t.subject}</span>`;
                tr.appendChild(th);

                for(let i=1; i<=8; i++) {
                    let td = document.createElement("td");
                    let btn = document.createElement("button");
                    btn.className = "cell-btn";
                    
                    const cellKey = `${currentDay}_${i}`;
                    const classVal = t.schedule[cellKey] || "";
                    
                    if(classVal) {
                        btn.innerText = formatNum(classVal);
                        btn.classList.add("has-class");
                    } else {
                        btn.innerHTML = "<span style='color:#cbd5e1; font-weight:normal;'>-</span>";
                    }

                    btn.dataset.id = t.id;
                    btn.dataset.day = currentDay;
                    btn.dataset.period = i;
                    btn.dataset.val = classVal;
                    
                    if(swapState && swapState.id === t.id && swapState.day === currentDay && swapState.period == i) {
                        btn.classList.add("selected-swap");
                    }

                    btn.onclick = () => handleMobileClick(btn);
                    td.appendChild(btn);
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            });

            updateInstructionBar();
            analyzeDay(); 
        }

        function handleMobileClick(clickedBtn) {
            const currentData = {
                id: clickedBtn.dataset.id,
                day: clickedBtn.dataset.day,
                period: clickedBtn.dataset.period,
                val: clickedBtn.dataset.val
            };

            if (!swapState) {
                swapState = currentData;
                renderGrid(); 
            } 
            else if (swapState.id === currentData.id && swapState.day === currentData.day && swapState.period === currentData.period) {
                swapState = null;
                renderGrid(); 
                openQuickEdit(currentData);
            } 
            else {
                executeCrossSwap(swapState, currentData);
                swapState = null;
                renderGrid();
            }
        }

        function executeCrossSwap(cell1, cell2) {
            const t1 = TEACHERS.find(t => t.id === cell1.id);
            const t2 = TEACHERS.find(t => t.id === cell2.id);

            t1.schedule[`${cell1.day}_${cell1.period}`] = cell2.val;
            t2.schedule[`${cell2.day}_${cell2.period}`] = cell1.val;

            MODIFIED_TEACHERS.add(cell1.id);
            MODIFIED_TEACHERS.add(cell2.id);

            Swal.fire({ toast: true, position: 'top', icon: 'success', title: 'تم التبديل بنجاح!', showConfirmButton: false, timer: 1500 });
        }

        function openQuickEdit(cellData) {
            currentEditData = cellData;
            const teacher = TEACHERS.find(t => t.id === cellData.id);
            
            document.getElementById("qe-title").innerText = `يوم ${dayNamesAr[cellData.day]} - حصة ${formatNum(cellData.period)}\n(أ. ${teacher.short_name})`;
            
            const inputField = document.getElementById("qe-class-input");
            inputField.value = formatNum(cellData.val);
            
            document.getElementById("qeModal").style.display = "flex";
            setTimeout(() => inputField.focus(), 100);
        }

        function closeQuickEdit() { 
            document.getElementById("qeModal").style.display = "none"; 
            currentEditData = null; 
        }

        function applyQuickEdit() {
            if(!currentEditData) return;
            const inputVal = document.getElementById("qe-class-input").value.trim();
            const enVal = inputVal.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
            updateCellData(enVal);
        }

        function clearQuickEdit() {
            if(!currentEditData) return;
            updateCellData("");
        }

        function updateCellData(newVal) {
            const teacher = TEACHERS.find(t => t.id === currentEditData.id);
            teacher.schedule[`${currentEditData.day}_${currentEditData.period}`] = newVal;
            
            MODIFIED_TEACHERS.add(currentEditData.id);
            closeQuickEdit();
            renderGrid();
        }

        function toggleRadar() {
            const bar = document.getElementById("radar-bar");
            bar.classList.toggle("expanded");
            const icon = document.getElementById("radar-icon");
            if(bar.classList.contains("expanded")) {
                icon.classList.remove("fa-satellite-dish");
                icon.classList.add("fa-chevron-down");
            } else {
                icon.classList.add("fa-satellite-dish");
                icon.classList.remove("fa-chevron-down");
            }
        }

        function analyzeDay() {
            const day = document.getElementById("day-select").value;
            const details = document.getElementById("radar-details");
            const badges = document.getElementById("radar-badges");
            details.innerHTML = "";
            badges.innerHTML = "";

            let conflicts = [];

            document.querySelectorAll('.cell-btn').forEach(btn => btn.classList.remove('conflict'));

            for(let p=1; p<=8; p++) {
                let periodMap = {}; 
                
                TEACHERS.forEach(t => {
                    const cls = t.schedule[`${day}_${p}`];
                    if(cls) {
                        if(!periodMap[cls]) periodMap[cls] = [];
                        periodMap[cls].push({ id: t.id, name: t.short_name });
                    }
                });

                for(let cls in periodMap) {
                    if(periodMap[cls].length > 1) {
                        let names = periodMap[cls].map(x => x.name).join(" و ");
                        conflicts.push(`حصة ${formatNum(p)}: فصل ${formatNum(cls)} مع (${names})`);
                        periodMap[cls].forEach(tea => {
                            let btn = document.querySelector(`.cell-btn[data-id="${tea.id}"][data-day="${day}"][data-period="${p}"]`);
                            if(btn) btn.classList.add('conflict');
                        });
                    }
                }
            }

            if(conflicts.length === 0) {
                badges.innerHTML = `<span class="badge ok"><i class="fa-solid fa-check"></i> لا يوجد تعارض</span>`;
                details.innerHTML = `<div style="text-align:center; color:var(--success); font-weight:bold; padding:20px;">الجدول سليم ولا يوجد تعارض في هذا اليوم.</div>`;
            } else {
                badges.innerHTML = `<span class="badge err">🔴 ${formatNum(conflicts.length)} تعارض</span>`;
                conflicts.forEach(msg => {
                    details.innerHTML += `<div class="alert-box alert-danger"><span>${msg}</span></div>`;
                });
            }
        }

        async function saveAllToCloud() {
            if(MODIFIED_TEACHERS.size === 0) {
                Swal.fire({ toast: true, position: 'top', icon: 'info', title: 'لا يوجد تعديلات للحفظ', showConfirmButton: false, timer: 2000 });
                return;
            }

            Swal.fire({ title: 'جاري الحفظ بالسحابة...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                for (let tId of MODIFIED_TEACHERS) {
                    const teacher = TEACHERS.find(t => t.id === tId);
                    
                    if (teacher.type === 'regular') {
                        await supabaseClient.from("teachers").update({ schedule: teacher.schedule }).eq("code", tId);
                    } else {
                        await supabaseClient.from("contract_teachers").update({ schedule: teacher.schedule }).eq("nid", tId);
                    }
                }
                
                MODIFIED_TEACHERS.clear(); 
                Swal.fire({ icon: 'success', title: 'تم الحفظ بنجاح', timer: 2000, showConfirmButton: false });
            } catch(e) {
                Swal.fire('خطأ', 'حدث خطأ أثناء الحفظ', 'error');
            }
        }
    </script>
</body>
</html>
