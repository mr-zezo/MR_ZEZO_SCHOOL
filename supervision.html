<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إعداد الإشراف اليومي - منظومة مستر زيزو</title>
    
    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبات Supabase و SweetAlert2 و html2canvas -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { 
            --primary: #1e3a8a;          
            --primary-hover: #172554;
            --secondary: #3b82f6;        
            --accent: #f59e0b;           
            --dark: #0f172a;             
            --bg: #f8fafc;               
            --surface: #ffffff;          
            --danger: #e11d48;           
            --success: #10b981;          
            --border: #cbd5e1;           
            --smart: #8b5cf6;            
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--dark); display: flex; flex-direction: column; align-items: center; padding: 12px; min-height: 100vh; }

        .top-nav {
            width: 100%; max-width: 1250px; background: var(--dark); padding: 12px 20px;
            border-radius: 12px; color: white; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            flex-wrap: wrap; gap: 12px; border-bottom: 4px solid var(--primary);
        }
        .nav-title { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 900; color: #fcd34d; margin: 0; }

        .mode-badge {
            padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 900;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .mode-online { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
        .mode-offline { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

        .nav-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .quick-nav-select {
            padding: 6px 12px; border-radius: 8px; border: 1px solid #fcd34d; background: var(--primary);
            color: white; font-weight: 800; font-family: 'Cairo'; outline: none; cursor: pointer; font-size: 12px;
        }
        .quick-nav-select option { background: white; color: black; }

        .btn-nav {
            text-decoration: none; color: white; background: rgba(255,255,255,0.1); padding: 6px 14px;
            border-radius: 8px; font-size: 12px; font-weight: 800; transition: 0.2s;
            display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer;
        }
        .btn-nav:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }

        .controls-bar {
            width: 100%; max-width: 1250px; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 15px; background: white; padding: 12px 18px;
            border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            flex-wrap: wrap; gap: 12px;
        }
        
        .day-group { display: flex; align-items: center; gap: 8px; }
        .day-group label { font-weight: 900; font-size: 14px; color: var(--primary); }
        .day-selector {
            padding: 8px 16px; font-size: 14px; font-weight: 900; border-radius: 8px;
            border: 2px solid var(--primary); outline: none; background: #eff6ff;
            color: var(--primary); cursor: pointer;
        }
        
        .btn-smart, .btn-save, .btn-print-form, .btn-config {
            color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: 900;
            font-size: 12px; cursor: pointer; display: inline-flex; align-items: center;
            gap: 6px; transition: 0.2s;
        }
        .btn-smart { background: linear-gradient(135deg, var(--smart), #6d28d9); box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3); }
        .btn-save { background: var(--success); }
        .btn-save:hover { background: #059669; transform: translateY(-2px); }
        .btn-smart:hover { transform: translateY(-2px); }
        .btn-print-form.daily { background: #0284c7; }
        .btn-print-form.daily:hover { background: #0369a1; transform: translateY(-2px); }
        .btn-print-form.weekly { background: #8b5cf6; }
        .btn-print-form.weekly:hover { background: #7c3aed; transform: translateY(-2px); }
        .btn-config { background: #475569; }
        .btn-config:hover { background: #334155; transform: translateY(-2px); }

        .tabs { display: flex; width: 100%; max-width: 1250px; gap: 10px; margin-bottom: 15px; }
        .tab-btn {
            flex: 1; padding: 12px; background: white; border: 2px solid var(--border);
            border-radius: 10px; font-size: 14px; font-weight: 900; color: #64748b;
            cursor: pointer; transition: 0.25s;
        }
        .tab-btn.active {
            background: var(--primary); color: white; border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(30,58,138,0.2);
        }

        .tab-content {
            width: 100%; max-width: 1250px; display: none;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px;
        }
        .tab-content.active { display: grid; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .building-card {
            background: white; border-radius: 12px; border: 1.5px solid var(--border);
            overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; flex-direction: column;
        }
        .building-header {
            background: #f1f5f9; padding: 10px 14px; font-weight: 900; font-size: 14px;
            color: var(--primary); border-bottom: 2px solid var(--border);
            display: flex; align-items: center; gap: 8px;
        }
        .building-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }

        .input-group { display: flex; flex-direction: column; gap: 3px; }
        .input-group label { font-size: 12px; font-weight: 800; color: #334155; }
        
        .search-input {
            width: 100%; padding: 8px 12px; border-radius: 8px; border: 1.5px solid #cbd5e1;
            font-size: 13.5px; font-weight: 900; outline: none; transition: 0.2s; background: #ffffff; color: #0f172a;
        }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15); }

        /* نوافذ منبثقة */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15,23,42,0.75); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg); width: 100%; max-width: 850px; border-radius: 16px;
            overflow: hidden; display: flex; flex-direction: column; max-height: 90vh;
        }
        .modal-header {
            background: linear-gradient(135deg, var(--smart), #6d28d9); color: white;
            padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h2 { font-size: 16px; font-weight: 900; margin: 0; display: flex; align-items: center; gap: 8px; }
        .btn-close { background: rgba(255,255,255,0.2); border: none; color: white; width: 32px; height: 32px; border-radius: 6px; font-size: 18px; cursor: pointer; }
        .modal-body { padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .smart-controls { display: flex; gap: 10px; background: white; padding: 12px; border-radius: 10px; border: 1px solid var(--border); flex-wrap: wrap; }
        .smart-controls select { flex: 1; min-width: 150px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); font-weight: 900; outline: none; font-size: 13px; }
        
        .suggestion-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
        .sug-card { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 12px; border-top: 4px solid var(--smart); }
        .sug-loc { font-size: 13px; font-weight: 900; color: var(--dark); margin-bottom: 8px; border-bottom: 1px dashed var(--border); padding-bottom: 4px; }
        
        .sug-teacher {
            display: flex; justify-content: space-between; align-items: center;
            background: #f8fafc; padding: 7px 10px; border-radius: 6px;
            margin-bottom: 6px; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.2s;
        }
        .sug-teacher:hover { background: #dcfce7; border-color: #86efac; transform: translateX(-4px); }
        .sug-t-name { font-size: 12.5px; font-weight: 900; color: var(--primary); display: flex; align-items: center; gap: 6px; }
        .sug-t-desc { font-size: 10px; font-weight: 800; color: #475569; background: #e2e8f0; padding: 2px 6px; border-radius: 6px; }

        .btn-finish-smart {
            background: var(--dark); color: white; border: none; padding: 12px;
            border-radius: 10px; font-weight: 900; font-size: 14px; cursor: pointer;
        }

        /* تنسيقات نافذة ضبط الطباعة */
        .config-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .config-tab-btn {
            flex: 1; padding: 8px 12px; border: 2px solid var(--border); border-radius: 8px;
            background: #fff; font-weight: 900; font-size: 12.5px; cursor: pointer; color: #475569;
        }
        .config-tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .config-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;
            background: white; padding: 15px; border-radius: 10px; border: 1px solid var(--border);
        }
        .config-item { display: flex; flex-direction: column; gap: 5px; }
        .config-item label { font-size: 12.5px; font-weight: 900; color: var(--primary); display: flex; justify-content: space-between; }
        .config-item input[type=range] { width: 100%; accent-color: var(--primary); cursor: pointer; }

        /* ================= تنسيقات الطباعة ================= */
        #printable-supervisor-form { display: none; }

        @media print {
            body * { visibility: hidden; }
            #printable-supervisor-form, #printable-supervisor-form * { visibility: visible; }
            #printable-supervisor-form {
                display: block !important;
                position: absolute;
                top: 0; left: 0; width: 100%;
                background: white; color: black;
                font-family: 'Cairo', Arial, sans-serif !important;
            }
        }
    </style>
</head>
<body>

    <datalist id="teachers-list"></datalist>

    <!-- 1. شريط التنقل العلوي -->
    <nav class="top-nav">
        <h1 class="nav-title"><i class="fa-solid fa-clipboard-user"></i> إعداد جداول الإشراف اليومي</h1>
        <div id="system-mode-badge" class="mode-badge mode-online"><i class="fa-solid fa-wifi"></i> <span>متصل بالسحابة</span></div>
        <div class="nav-actions">
            <button onclick="takeSupervisionScreenshot()" class="btn-nav" style="background:#475569;"><i class="fa-solid fa-camera"></i> لقطة شاشة</button>
            <select class="quick-nav-select" onchange="if(this.value) window.location.href=this.value;">
                <option value="" disabled selected>🚀 انتقال سريع...</option>
                <option value="index.html">الرئيسية</option>
                <option value="schedule.html">الجدول المدرسي</option>
                <option value="general-schedule.html">الجدول العام الشامل</option>
                <option value="school-map.html">خريطة المبنى</option>
                <option value="supervisor.html">بوابة المشرف العام</option>
            </select>
            <a href="index.html" class="btn-nav"><i class="fa-solid fa-house"></i> الرئيسية</a>
        </div>
    </nav>

    <!-- 2. شريط التحكم والعمليات -->
    <div class="controls-bar">
        <div class="day-group">
            <label><i class="fa-regular fa-calendar-check"></i> اليوم:</label>
            <select class="day-selector" id="day-select" onchange="loadSupervisionData()">
                <option value="الاحد">الأحد</option><option value="الاثنين">الإثنين</option>
                <option value="الثلاثاء">الثلاثاء</option><option value="الاربعاء">الأربعاء</option>
                <option value="الخميس">الخميس</option>
            </select>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
            <button class="btn-smart" onclick="openSmartAssistant()"><i class="fa-solid fa-wand-magic-sparkles"></i> المساعد الذكي</button>
            <button class="btn-save" onclick="saveSupervisionData()"><i class="fa-solid fa-floppy-disk"></i> حفظ</button>
            <button class="btn-print-form daily" onclick="printSupervisorForm()"><i class="fa-solid fa-print"></i> استمارة اليوم</button>
            <button class="btn-print-form weekly" onclick="printWeeklyForm()"><i class="fa-solid fa-calendar-week"></i> استمارة الأسبوع (أفقي)</button>
            <button class="btn-config" onclick="openPrintSettingsModal()"><i class="fa-solid fa-sliders"></i> مقاسات الطباعة</button>
        </div>
    </div>

    <!-- 3. أزرار التبويب -->
    <div class="tabs">
        <button class="tab-btn active" id="tab-btn-lower" onclick="switchTab('lower')">إشراف الصفوف الأولى (1 - 3)</button>
        <button class="tab-btn" id="tab-btn-upper" onclick="switchTab('upper')">إشراف الصفوف العليا (4 - 6)</button>
    </div>

    <!-- ================= 4. شاشة الصفوف الأولى ================= -->
    <div id="tab-lower" class="tab-content active">
        <div class="building-card">
            <div class="building-header"><i class="fa-solid fa-star" style="color:var(--accent);"></i> القيادة والفناء والإخلاء</div>
            <div class="building-body">
                <div class="input-group"><label>المشرف العام</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="general" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label style="color:var(--danger);"><i class="fa-solid fa-person-walking-dashed-line-arrow-right"></i> مشرف الإخلاء</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="evacuation" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (1)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="yard_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (2)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="yard_2" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (3)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="yard_3" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (4)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="yard_4" placeholder="ابحث بالاسم..."></div>
            </div>
        </div>

        <div class="building-card">
            <div class="building-header"><i class="fa-regular fa-building"></i> المبنى القديم</div>
            <div class="building-body">
                <div class="input-group"><label>الدور الأرضي</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="old_ground" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثاني ( 1)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="old_f2_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثاني ( 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="old_f2_2" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثالث ( 1)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="old_f3_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثالث ( 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="old_f3_2" placeholder="ابحث بالاسم..."></div>
            </div>
        </div>

        <div class="building-card">
            <div class="building-header"><i class="fa-solid fa-city"></i> المبنى الشرقي</div>
            <div class="building-body">
                <div class="input-group"><label>الدور الأرضي</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="east_ground" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثاني ( 1)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="east_f2_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثاني ( 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="east_f2_2" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثالث ( 1)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="east_f3_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثالث ( 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="east_f3_2" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الرابع (1)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="east_f4_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الرابع ( 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="east_f4_2" placeholder="ابحث بالاسم..."></div>
            </div>
        </div>
    </div>

    <!-- ================= 5. شاشة الصفوف العليا ================= -->
    <div id="tab-upper" class="tab-content">
        <div class="building-card">
            <div class="building-header"><i class="fa-solid fa-star" style="color:var(--accent);"></i> القيادة والفناء والإخلاء</div>
            <div class="building-body">
                <div class="input-group"><label>المشرف العام</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="general" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label style="color:var(--danger);"><i class="fa-solid fa-person-walking-dashed-line-arrow-right"></i> مشرف الإخلاء</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="evacuation" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (1)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="yard_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (2)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="yard_2" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (3)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="yard_3" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (4)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="yard_4" placeholder="ابحث بالاسم..."></div>
            </div>
        </div>

        <div class="building-card" style="grid-column: span 2;">
            <div class="building-header"><i class="fa-solid fa-hotel"></i> المبنى الجديد (الصفوف العليا)</div>
            <div class="building-body" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;">
                <div class="input-group"><label>الدور الأرضي (1)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_ground_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الأرضي ( 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_ground_2" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثاني (1)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f2_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثاني ( 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f2_2" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثالث ( 1)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f3_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثالث ( 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f3_2" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الرابع ( 1)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f4_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الرابع ( 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f4_2" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الخامس ( 1)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f5_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الخامس ( 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f5_2" placeholder="ابحث بالاسم..."></div>
            </div>
        </div>
    </div>

    <!-- ================= 6. نافذة المساعد الذكي ================= -->
    <div class="modal-overlay" id="smartModal" onclick="if(event.target===this) this.classList.remove('active')">
        <div class="modal-content">
            <div class="modal-header">

        async function fetchBaseData() {
            let teachersData = [], contractData = [], mapData = [];

            if (supabaseClient) {
                try {
                    const resTea = await supabaseClient.from("teachers").select("*");
                    if (!resTea.error && resTea.data) teachersData = resTea.data;
                    const resCon = await supabaseClient.from("contract_teachers").select("*");
                    if (!resCon.error && resCon.data) contractData = resCon.data;
                    const resMap = await supabaseClient.from("school_map").select("*").eq("id", "main_layout").maybeSingle();
                    if (!resMap.error && resMap.data && resMap.data.map_data) mapData = resMap.data.map_data;
                } catch(e) {}
            }

            if (teachersData.length === 0) teachersData = JSON.parse(localStorage.getItem('local_teachers')) || [];
            if (contractData.length === 0) contractData = JSON.parse(localStorage.getItem('local_contract_teachers')) || [];
            if (mapData.length === 0) mapData = JSON.parse(localStorage.getItem('local_school_map')) || [];

            ALL_TEACHERS = [];
            const isExcludedJob = (job) => (job||"").replace(/\s+/g,"").match(/عامل|اداري|اخصائي|مشرف|سكرتير|فني|خدمات/);

            [...teachersData, ...contractData].forEach(t => {
                const jobName = t.cadre_job || t.job || '';
                if (!isExcludedJob(jobName)) {
                    let parsedSchedule = typeof t.schedule === 'string' ? (JSON.parse(t.schedule) || {}) : (t.schedule || {});
                    ALL_TEACHERS.push({ name: t.name, cadre: jobName, schedule: parsedSchedule });
                }
            });

            populateDatalist();
            SCHOOL_MAP = mapData;
        }

        async function loadSupervisionData() {
            document.querySelectorAll('.search-input').forEach(inp => inp.value = "");
            const day = document.getElementById("day-select").value;
            let supervisionRecords = [];

            if (supabaseClient) {
                try {
                    const { data } = await supabaseClient.from("supervision").select("*").eq("day", day);
                    if (data && data.length > 0) supervisionRecords = data;
                } catch(e) {}
            }
            if (supervisionRecords.length === 0) {
                supervisionRecords = JSON.parse(localStorage.getItem(`local_supervision_${day}`)) || [];
            }

            supervisionRecords.forEach(record => {
                const stage = record.stage;
                const assignments = record.data || {};
                for(let loc in assignments) {
                    let input = document.querySelector(`.search-input[data-stage="${stage}"][data-loc="${loc}"]`);
                    if(input) input.value = assignments[loc];
                }
            });
        }

        async function saveSupervisionData() {
            const day = document.getElementById("day-select").value;
            let lowerData = {}, upperData = {};

            document.querySelectorAll('.search-input[data-stage="lower"]').forEach(inp => {
                if(inp.value.trim() !== "") lowerData[inp.getAttribute("data-loc")] = inp.value.trim();
            });
            document.querySelectorAll('.search-input[data-stage="upper"]').forEach(inp => {
                if(inp.value.trim() !== "") upperData[inp.getAttribute("data-loc")] = inp.value.trim();
            });

            const recordsToUpsert = [
                { id: `${day}_lower`, day: day, stage: 'lower', data: lowerData },
                { id: `${day}_upper`, day: day, stage: 'upper', data: upperData }
            ];

            localStorage.setItem(`local_supervision_${day}`, JSON.stringify(recordsToUpsert));

            if (supabaseClient) {
                try {
                    await supabaseClient.from("supervision").upsert(recordsToUpsert);
                    Swal.fire({ icon: 'success', title: 'تم الحفظ بنجاح!', timer: 1500, showConfirmButton: false });
                } catch(e) { 
                    Swal.fire({ icon: 'warning', title: 'تم الحفظ محلياً على جهازك' });
                }
            } else {
                Swal.fire({ icon: 'success', title: 'تم الحفظ محلياً بنجاح', timer: 1500, showConfirmButton: false });
            }
        }

        // ================= طباعة استمارة الأسبوع (A4 Landscape - أفقي بـ 10 صفوف فقط موسعة) =================
        async function printWeeklyForm() {
            const cfg = printConfig.weekly;
            Swal.fire({ title: 'جاري استدعاء المشرفين للأسبوع...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            const isLower = document.getElementById('tab-btn-lower').classList.contains('active');
            const stage = isLower ? 'lower' : 'upper';
            const stageText = isLower ? "الصفوف الأولى (1 - 3)" : "الصفوف العليا (4 - 6)";
            
            const daysKeys = ["الاحد", "الاثنين", "الثلاثاء", "الاربعاء", "الخميس"];
            const daysLabels = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس"];
            
            let dayTeachers = {};

            for (let day of daysKeys) {
                dayTeachers[day] = [];
                let dayRecords = [];
                if (supabaseClient) {
                    try {
                        const { data } = await supabaseClient.from("supervision").select("*").eq("day", day).eq("stage", stage);
                        if (data && data.length > 0) dayRecords = data;
                    } catch(e) {}
                }
                if (dayRecords.length === 0) {
                    const localData = JSON.parse(localStorage.getItem(`local_supervision_${day}`)) || [];
                    dayRecords = localData.filter(r => r.stage === stage);
                }

                if (dayRecords.length > 0 && dayRecords[0].data) {
                    const assignments = dayRecords[0].data;
                    FORM_LOCATIONS[stage].forEach(item => {
                        const tName = (assignments[item.loc] || "").trim();
                        if (tName && !dayTeachers[day].includes(tName)) {
                            dayTeachers[day].push(tName);
                        }
                    });
                }
            }

            // تثبيت عدد الصفوف ليكون 10 صفوف بالضبط
            const totalRows = 10;
            let rowsHtml = "";
            for (let i = 0; i < totalRows; i++) {
                let row = `
                    <tr style="height: ${cfg.rowHeight}px;">
                        <td style="text-align: center; font-weight: 900; font-size: ${cfg.fontSize}px; border: 2px solid #000; padding: ${cfg.padding}px;">${i + 1}</td>
                `;
                daysKeys.forEach(day => {
                    const teacher = dayTeachers[day][i] || "";
                    row += `<td style="text-align: center; font-weight: 900; font-size: ${cfg.fontSize}px; border: 2px solid #000; padding: ${cfg.padding}px 6px; color: #000;">${teacher}</td>`;
                });
                row += `</tr>`;
                rowsHtml += row;
            }

            Swal.close();

            const printContainer = document.getElementById('printable-supervisor-form');
            printContainer.innerHTML = `
                <style>@media print { @page { size: A4 landscape; margin: 8mm 12mm; } }</style>
                <div style="padding: 10px; width: 100%; box-sizing: border-box; direction: rtl; font-family: 'Cairo', Arial, sans-serif;">
                    
                    <!-- الترويسة الأفقية الرسمية -->
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2.5px solid #000; padding-bottom: 10px; margin-bottom: 28px;">
                        <div style="text-align: right; font-weight: 800; font-size: 13px; line-height: 1.4;">
                            <div>وزارة التربية والتعليم والتعليم الفني</div>
                            <div>مديرية التربية والتعليم</div>
                            <div><b>مدرسة الشهيد أشرف حبيب الابتدائية</b></div>
                        </div>
                        <div style="text-align: center;">
                            <div style="background: #1e3a8a; color: #ffffff; padding: 6px 35px; border-radius: 8px; font-size: 20px; font-weight: 900; margin-bottom: 6px; display: inline-block;">
                                كشف توزيع المشرفين الأسبوعي
                            </div>
                            <div style="font-size: 14px; font-weight: 900;">${stageText} — العام الدراسي ٢٠٢٦ / ٢٠٢٧ م</div>
                        </div>
                        <div style="text-align: left; font-weight: 800; font-size: 13px; border: 2px solid #000; padding: 6px 14px; border-radius: 6px;">
                            يعتمد للعمل به أسبوعياً
                        </div>
                    </div>

                    <!-- جدول الأسبوع المكون من 10 صفوف متباعدة بخط كبير -->
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                        <thead>
                            <tr style="background: #e2e8f0; font-size: ${cfg.headerSize}px; font-weight: 900; height: 50px;">
                                <th style="border: 2px solid #000; width: 50px; text-align: center;">م</th>
                                ${daysLabels.map(d => `<th style="border: 2px solid #000; text-align: center; width: 19.2%;">${d}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>

                    <!-- التوقيع الرسمي: يعتمد مدير المدرسة فقط -->
                    <div style="display: flex; justify-content: flex-end; padding: 10px 50px; font-weight: 900; font-size: 15px;">
                        <div style="text-align: center;">
                            <div>يعتمد / مدير المدرسة</div>
                            <div style="margin-top: 25px;">الاسم والتوقيع: .......................................</div>
                        </div>
                    </div>
                </div>
            `;
            window.print();
        }

        /* دوال المساعد الذكي وتصوير الشاشة */
        function getTeacherClass(teacherSchedule, dayName, periodNum) {
            if (!teacherSchedule) return null;
            const targetDay = dayName.replace(/أ|إ|آ/g, 'ا');
            for (let key in teacherSchedule) {
                const cleanKey = key.replace(/أ|إ|آ/g, 'ا');
                if (cleanKey === `${targetDay}_${periodNum}` || cleanKey === `${targetDay} ${periodNum}` || cleanKey === `${targetDay}-${periodNum}`) return teacherSchedule[key];
            }
            if (teacherSchedule[targetDay] && typeof teacherSchedule[targetDay] === 'object') return teacherSchedule[targetDay][periodNum] || teacherSchedule[targetDay][String(periodNum)];
            return null;
        }

        function extractClassSignature(val) {
            if (!val) return "";
            let str = typeof val === 'object' ? (val.class || val.cls || val.room || JSON.stringify(val)) : String(val);
            str = str.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
            const match = str.match(/([1-6])\s*[\/\\\-]\s*([1-9])/);
            if (match) return `${match[1]}/${match[2]}`;
            return str.replace(/[\s\-]/g, '/').trim();
        }

        function openSmartAssistant() {
            document.getElementById("smart-day").value = document.getElementById("day-select").value;
            const isLowerActive = document.getElementById('tab-btn-lower').classList.contains('active');
            document.getElementById("smart-stage").value = isLowerActive ? 'lower' : 'upper';
            generateSmartSuggestions();
            document.getElementById("smartModal").classList.add("active");
        }

        function generateSmartSuggestions() {
            const day = document.getElementById("smart-day").value;
            const stage = document.getElementById("smart-stage").value;
            const container = document.getElementById("suggestion-container");
            const infoBox = document.getElementById("smart-criteria-info");
            container.innerHTML = "";

            if(ALL_TEACHERS.length === 0) return;
            const totalP = PERIOD_CONFIG[stage][day];
            infoBox.innerHTML = `نصاب يوم ${day}: ${totalP} حصص. (الترتيب حسب: نصاب بالدور، وفراغ بآخر اليوم).`;
            
            const stageMapping = FLOOR_LOCS_MAP[stage] || {};
            let targetFloors = [];

            SCHOOL_MAP.forEach(bldg => {
                if (bldg.floors) {
                    bldg.floors.forEach(floor => {
                        const mapKey = `${bldg.name}_${floor.name}`;
                        if(stageMapping[mapKey]) targetFloors.push({ bldgName: bldg.name, floorName: floor.name, locKeys: stageMapping[mapKey], classes: (floor.rooms || []).map(r => extractClassSignature(r)) });
                    });
                }
            });

            let html = "";
            targetFloors.forEach(floor => {
                let candidateScores = [];
                ALL_TEACHERS.forEach(t => {
                    let classesInThisFloor = 0;
                    for(let p = 1; p <= 8; p++) {
                        let rawCls = getTeacherClass(t.schedule, day, p);
                        if(rawCls && floor.classes.includes(extractClassSignature(rawCls))) classesInThisFloor++;
                    }
                    let score = classesInThisFloor * 15;
                    const freeLast = !getTeacherClass(t.schedule, day, totalP);
                    const freeBeforeLast = !getTeacherClass(t.schedule, day, totalP - 1);
                    if(freeLast && freeBeforeLast) score += 25; else if(freeLast) score += 15;
                    if(classesInThisFloor > 0 || score >= 20) candidateScores.push({ name: t.name, score: score, floorClasses: classesInThisFloor, badge: freeLast ? 'فاضي آخر اليوم' : 'مشغول' });
                });

                candidateScores.sort((a,b) => b.score - a.score);
                let teachersHtml = "";
                candidateScores.slice(0, 4).forEach((t, i) => {
                    teachersHtml += `<div class="sug-teacher" onclick="autoAssignTeacher('${stage}', ${JSON.stringify(floor.locKeys).replace(/"/g, '&quot;')}, '${t.name}', this)">
                                        <span class="sug-t-name">${t.name}</span><span class="sug-t-desc">${t.floorClasses} حصص | ${t.badge}</span>
                                     </div>`;
                });
                html += `<div class="sug-card"><div class="sug-loc">${floor.bldgName} - ${floor.floorName}</div>${teachersHtml || '<div style="font-size:11px;">لا يوجد مطابق</div>'}</div>`;
            });
            container.innerHTML = html;
        }

        function autoAssignTeacher(stage, locKeys, teacherName, btnEl) {
            document.getElementById("day-select").value = document.getElementById("smart-day").value;
            switchTab(stage);
            let assignedLoc = locKeys.find(key => { let i = document.querySelector(`.search-input[data-stage="${stage}"][data-loc="${key}"]`); return i && i.value.trim() === ""; }) || locKeys[0];
            let input = document.querySelector(`.search-input[data-stage="${stage}"][data-loc="${assignedLoc}"]`);
            if(input) { input.value = teacherName; input.style.backgroundColor = "#dcfce7"; setTimeout(() => input.style.backgroundColor = "", 1000); }
            btnEl.style.background = "#dcfce7";
            Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1000, icon: 'success', title: `تم التسكين` });
        }
    </script>
