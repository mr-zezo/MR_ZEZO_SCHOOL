<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إعداد الإشراف اليومي - منظومة مستر زيزو</title>
    
    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبات Supabase و SweetAlert2 و html2canvas -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { 
            --primary: #1e3a8a;          
            --primary-hover: #172554;
            --secondary: #3b82f6;        
            --accent: #f59e0b;           
            --dark: #0f172a;             
            --bg: #f8fafc;               
            --surface: #ffffff;          
            --danger: #e11d48;           
            --success: #10b981;          
            --border: #cbd5e1;           
            --smart: #8b5cf6;            
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--dark); display: flex; flex-direction: column; align-items: center; padding: 12px; min-height: 100vh; }

        .top-nav {
            width: 100%; max-width: 1250px; background: var(--dark); padding: 12px 20px;
            border-radius: 12px; color: white; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            flex-wrap: wrap; gap: 12px; border-bottom: 4px solid var(--primary);
        }
        .nav-title { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 900; color: #fcd34d; margin: 0; }

        .mode-badge {
            padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 900;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .mode-online { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
        .mode-offline { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

        .nav-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .quick-nav-select {
            padding: 6px 12px; border-radius: 8px; border: 1px solid #fcd34d; background: var(--primary);
            color: white; font-weight: 800; font-family: 'Cairo'; outline: none; cursor: pointer; font-size: 12px;
        }
        .quick-nav-select option { background: white; color: black; }

        .btn-nav {
            text-decoration: none; color: white; background: rgba(255,255,255,0.1); padding: 6px 14px;
            border-radius: 8px; font-size: 12px; font-weight: 800; transition: 0.2s;
            display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer;
        }
        .btn-nav:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }

        .controls-bar {
            width: 100%; max-width: 1250px; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 15px; background: white; padding: 12px 18px;
            border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            flex-wrap: wrap; gap: 12px;
        }
        
        .day-group { display: flex; align-items: center; gap: 8px; }
        .day-group label { font-weight: 900; font-size: 14px; color: var(--primary); }
        .day-selector {
            padding: 8px 16px; font-size: 14px; font-weight: 900; border-radius: 8px;
            border: 2px solid var(--primary); outline: none; background: #eff6ff;
            color: var(--primary); cursor: pointer;
        }
        
        .btn-smart {
            background: linear-gradient(135deg, var(--smart), #6d28d9); color: white;
            border: none; padding: 10px 16px; border-radius: 8px; font-weight: 900;
            font-size: 13px; cursor: pointer; display: inline-flex; align-items: center;
            gap: 8px; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3); transition: 0.2s;
        }
        .btn-smart:hover { transform: translateY(-2px); }

        .btn-save {
            background: var(--success); color: white; border: none; padding: 10px 18px;
            border-radius: 8px; font-weight: 900; font-size: 13px; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .btn-save:hover { transform: translateY(-2px); background: #059669; }

        .btn-print-form {
            background: #0284c7; color: white; border: none; padding: 10px 18px;
            border-radius: 8px; font-weight: 900; font-size: 13px; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .btn-print-form:hover { background: #0369a1; transform: translateY(-2px); }

        .tabs { display: flex; width: 100%; max-width: 1250px; gap: 10px; margin-bottom: 15px; }
        .tab-btn {
            flex: 1; padding: 12px; background: white; border: 2px solid var(--border);
            border-radius: 10px; font-size: 14px; font-weight: 900; color: #64748b;
            cursor: pointer; transition: 0.25s;
        }
        .tab-btn.active {
            background: var(--primary); color: white; border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(30,58,138,0.2);
        }

        .tab-content {
            width: 100%; max-width: 1250px; display: none;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px;
        }
        .tab-content.active { display: grid; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .building-card {
            background: white; border-radius: 12px; border: 1.5px solid var(--border);
            overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; flex-direction: column;
        }
        .building-header {
            background: #f1f5f9; padding: 10px 14px; font-weight: 900; font-size: 14px;
            color: var(--primary); border-bottom: 2px solid var(--border);
            display: flex; align-items: center; gap: 8px;
        }
        .building-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }

        .input-group { display: flex; flex-direction: column; gap: 3px; }
        .input-group label { font-size: 12px; font-weight: 800; color: #334155; }
        
        .search-input {
            width: 100%; padding: 8px 12px; border-radius: 8px; border: 1.5px solid #cbd5e1;
            font-size: 13.5px; font-weight: 900; outline: none; transition: 0.2s; background: #ffffff; color: #0f172a;
        }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15); }

        /* نافذة المساعد الذكي */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15,23,42,0.75); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg); width: 100%; max-width: 850px; border-radius: 16px;
            overflow: hidden; display: flex; flex-direction: column; max-height: 90vh;
        }
        .modal-header {
            background: linear-gradient(135deg, var(--smart), #6d28d9); color: white;
            padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h2 { font-size: 16px; font-weight: 900; margin: 0; display: flex; align-items: center; gap: 8px; }
        .btn-close { background: rgba(255,255,255,0.2); border: none; color: white; width: 32px; height: 32px; border-radius: 6px; font-size: 18px; cursor: pointer; }
        .modal-body { padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .smart-controls { display: flex; gap: 10px; background: white; padding: 12px; border-radius: 10px; border: 1px solid var(--border); flex-wrap: wrap; }
        .smart-controls select { flex: 1; min-width: 150px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); font-weight: 900; outline: none; font-size: 13px; }
        
        .suggestion-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
        .sug-card { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 12px; border-top: 4px solid var(--smart); }
        .sug-loc { font-size: 13px; font-weight: 900; color: var(--dark); margin-bottom: 8px; border-bottom: 1px dashed var(--border); padding-bottom: 4px; }
        
        .sug-teacher {
            display: flex; justify-content: space-between; align-items: center;
            background: #f8fafc; padding: 7px 10px; border-radius: 6px;
            margin-bottom: 6px; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.2s;
        }
        .sug-teacher:hover { background: #dcfce7; border-color: #86efac; transform: translateX(-4px); }
        .sug-t-name { font-size: 12.5px; font-weight: 900; color: var(--primary); display: flex; align-items: center; gap: 6px; }
        .sug-t-desc { font-size: 10px; font-weight: 800; color: #475569; background: #e2e8f0; padding: 2px 6px; border-radius: 6px; }

        .btn-finish-smart {
            background: var(--dark); color: white; border: none; padding: 12px;
            border-radius: 10px; font-weight: 900; font-size: 14px; cursor: pointer;
        }

        /* ================= تنسيقات الطباعة A4 Portrait الصارمة ================= */
        #printable-supervisor-form {
            display: none;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 8mm 10mm;
            }
            body * {
                visibility: hidden;
            }
            #printable-supervisor-form, #printable-supervisor-form * {
                visibility: visible;
            }
            #printable-supervisor-form {
                display: block !important;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                background: white;
                color: black;
                font-family: 'Cairo', Arial, sans-serif !important;
            }
        }

        @media (max-width: 768px) {
            .top-nav, .controls-bar { flex-direction: column; text-align: center; }
            .btn-smart, .btn-save, .btn-print-form { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <datalist id="teachers-list"></datalist>

    <!-- 1. شريط التنقل العلوي -->
    <nav class="top-nav">
        <h1 class="nav-title"><i class="fa-solid fa-clipboard-user"></i> إعداد جداول الإشراف اليومي</h1>
        <div id="system-mode-badge" class="mode-badge mode-online"><i class="fa-solid fa-wifi"></i> <span>متصل بالسحابة</span></div>
        <div class="nav-actions">
            <button onclick="takeSupervisionScreenshot()" class="btn-nav" style="background:#475569;"><i class="fa-solid fa-camera"></i> لقطة شاشة</button>
            <select class="quick-nav-select" onchange="if(this.value) window.location.href=this.value;">
                <option value="" disabled selected>🚀 انتقال سريع...</option>
                <option value="index.html">الرئيسية</option>
                <option value="schedule.html">الجدول المدرسي</option>
                <option value="general-schedule.html">الجدول العام الشامل</option>
                <option value="school-map.html">خريطة المبنى</option>
                <option value="supervisor.html">بوابة المشرف العام</option>
            </select>
            <a href="index.html" class="btn-nav"><i class="fa-solid fa-house"></i> الرئيسية</a>
        </div>
    </nav>

    <!-- 2. شريط التحكم والعمليات -->
    <div class="controls-bar">
        <div class="day-group">
            <label><i class="fa-regular fa-calendar-check"></i> إعداد إشراف يوم:</label>
            <select class="day-selector" id="day-select" onchange="loadSupervisionData()">
                <option value="الاحد">الأحد</option><option value="الاثنين">الإثنين</option>
                <option value="الثلاثاء">الثلاثاء</option><option value="الاربعاء">الأربعاء</option>
                <option value="الخميس">الخميس</option>
            </select>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="btn-smart" onclick="openSmartAssistant()"><i class="fa-solid fa-wand-magic-sparkles"></i> المساعد الذكي</button>
            <button class="btn-save" onclick="saveSupervisionData()"><i class="fa-solid fa-floppy-disk"></i> حفظ بالسحابة</button>
            <button class="btn-print-form" onclick="printSupervisorForm()"><i class="fa-solid fa-print"></i> استمارة المشرف (A4)</button>
            <button onclick="takeSupervisionScreenshot()" class="btn-nav" style="background:#475569;"><i class="fa-solid fa-camera"></i> صورة الجدول</button>
        </div>
    </div>

    <!-- 3. أزرار التبويب -->
    <div class="tabs">
        <button class="tab-btn active" id="tab-btn-lower" onclick="switchTab('lower')">إشراف الصفوف الأولى (1 - 3)</button>
        <button class="tab-btn" id="tab-btn-upper" onclick="switchTab('upper')">إشراف الصفوف العليا (4 - 6)</button>
    </div>

    <!-- ================= 4. شاشة الصفوف الأولى ================= -->
    <div id="tab-lower" class="tab-content active">
        <!-- القيادة والفناء والإخلاء -->
        <div class="building-card">
            <div class="building-header"><i class="fa-solid fa-star" style="color:var(--accent);"></i> القيادة والفناء والإخلاء</div>
            <div class="building-body">
                <div class="input-group"><label>المشرف العام</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="general" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label style="color:var(--danger);"><i class="fa-solid fa-person-walking-dashed-line-arrow-right"></i> مشرف الإخلاء</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="evacuation" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (1)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="yard_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (2)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="yard_2" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (3)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="yard_3" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (4)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="yard_4" placeholder="ابحث بالاسم..."></div>
            </div>
        </div>

        <!-- المبنى القديم -->
        <div class="building-card">
            <div class="building-header"><i class="fa-regular fa-building"></i> المبنى القديم</div>
            <div class="building-body">
                <div class="input-group"><label>الدور الأرضي</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="old_ground" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثاني (مشرف 1)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="old_f2_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثاني (مشرف 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="old_f2_2" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثالث (مشرف 1)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="old_f3_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثالث (مشرف 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="old_f3_2" placeholder="ابحث بالاسم..."></div>
            </div>
        </div>

        <!-- المبنى الشرقي -->
        <div class="building-card">
            <div class="building-header"><i class="fa-solid fa-city"></i> المبنى الشرقي</div>
            <div class="building-body">
                <div class="input-group"><label>الدور الأرضي</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="east_ground" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثاني (مشرف 1)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="east_f2_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثاني (مشرف 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="east_f2_2" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثالث (مشرف 1)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="east_f3_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثالث (مشرف 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="east_f3_2" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الرابع (مشرف 1)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="east_f4_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الرابع (مشرف 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="east_f4_2" placeholder="ابحث بالاسم..."></div>
            </div>
        </div>
    </div>

    <!-- ================= 5. شاشة الصفوف العليا ================= -->
    <div id="tab-upper" class="tab-content">
        <!-- القيادة والفناء والإخلاء -->
        <div class="building-card">
            <div class="building-header"><i class="fa-solid fa-star" style="color:var(--accent);"></i> القيادة والفناء والإخلاء</div>
            <div class="building-body">
                <div class="input-group"><label>المشرف العام</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="general" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label style="color:var(--danger);"><i class="fa-solid fa-person-walking-dashed-line-arrow-right"></i> مشرف الإخلاء</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="evacuation" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (1)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="yard_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (2)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="yard_2" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (3)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="yard_3" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (4)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="yard_4" placeholder="ابحث بالاسم..."></div>
            </div>
        </div>

        <!-- المبنى الجديد (الصفوف العليا) -->
        <div class="building-card" style="grid-column: span 2;">
            <div class="building-header"><i class="fa-solid fa-hotel"></i> المبنى الجديد (الصفوف العليا)</div>
            <div class="building-body" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;">
                <div class="input-group"><label>الدور الأرضي (مشرف 1)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_ground_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الأرضي (مشرف 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_ground_2" placeholder="ابحث بالاسم..."></div>
                
                <div class="input-group"><label>الدور الثاني (مشرف 1)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f2_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثاني (مشرف 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f2_2" placeholder="ابحث بالاسم..."></div>
                
                <div class="input-group"><label>الدور الثالث (مشرف 1)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f3_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثالث (مشرف 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f3_2" placeholder="ابحث بالاسم..."></div>
                
                <div class="input-group"><label>الدور الرابع (مشرف 1)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f4_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الرابع (مشرف 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f4_2" placeholder="ابحث بالاسم..."></div>
                
                <div class="input-group"><label>الدور الخامس (مشرف 1)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f5_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الخامس (مشرف 2)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f5_2" placeholder="ابحث بالاسم..."></div>
            </div>
        </div>
    </div>

    <!-- ================= 6. نافذة المساعد الذكي ================= -->
    <div class="modal-overlay" id="smartModal" onclick="if(event.target===this) this.classList.remove('active')">

        function extractClassSignature(val) {
            if (!val) return "";
            let str = typeof val === 'object' ? (val.class || val.cls || val.room || JSON.stringify(val)) : String(val);
            str = str.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
            const match = str.match(/([1-6])\s*[\/\\\-]\s*([1-9])/);
            if (match) return `${match[1]}/${match[2]}`;
            return str.replace(/[\s\-]/g, '/').trim();
        }

        function getTeacherClass(teacherSchedule, dayName, periodNum) {
            if (!teacherSchedule) return null;
            const targetDay = dayName.replace(/أ|إ|آ/g, 'ا');

            for (let key in teacherSchedule) {
                const cleanKey = key.replace(/أ|إ|آ/g, 'ا');
                if (cleanKey === `${targetDay}_${periodNum}` || cleanKey === `${targetDay} ${periodNum}` || cleanKey === `${targetDay}-${periodNum}`) {
                    return teacherSchedule[key];
                }
            }
            if (teacherSchedule[targetDay] && typeof teacherSchedule[targetDay] === 'object') {
                return teacherSchedule[targetDay][periodNum] || teacherSchedule[targetDay][String(periodNum)];
            }
            return null;
        }

        async function fetchBaseData() {
            let teachersData = [], contractData = [], mapData = [];

            if (supabaseClient) {
                try {
                    const resTea = await supabaseClient.from("teachers").select("*");
                    if (!resTea.error && resTea.data) {
                        teachersData = resTea.data;
                        localStorage.setItem('local_teachers', JSON.stringify(teachersData));
                    }
                } catch(e) {}

                try {
                    const resCon = await supabaseClient.from("contract_teachers").select("*");
                    if (!resCon.error && resCon.data) {
                        contractData = resCon.data;
                        localStorage.setItem('local_contract_teachers', JSON.stringify(contractData));
                    }
                } catch(e) {}

                try {
                    const resMap = await supabaseClient.from("school_map").select("*").eq("id", "main_layout").maybeSingle();
                    if (!resMap.error && resMap.data && resMap.data.map_data) {
                        mapData = resMap.data.map_data;
                        localStorage.setItem('local_school_map', JSON.stringify(mapData));
                    }
                } catch(e) {}
            }

            if (teachersData.length === 0) teachersData = JSON.parse(localStorage.getItem('local_teachers')) || [];
            if (contractData.length === 0) contractData = JSON.parse(localStorage.getItem('local_contract_teachers')) || [];
            if (mapData.length === 0) mapData = JSON.parse(localStorage.getItem('local_school_map')) || [];

            ALL_TEACHERS = [];
            let datalistHtml = "";
            const isExcludedJob = (job) => (job||"").replace(/\s+/g,"").match(/عامل|اداري|اخصائي|مشرف|سكرتير|فني|خدمات/);

            [...teachersData, ...contractData].forEach(t => {
                const jobName = t.cadre_job || t.job || '';
                if (!isExcludedJob(jobName)) {
                    let parsedSchedule = t.schedule || {};
                    if (typeof parsedSchedule === 'string') {
                        try { parsedSchedule = JSON.parse(parsedSchedule); } catch(e) { parsedSchedule = {}; }
                    }

                    ALL_TEACHERS.push({
                        name: t.name,
                        cadre: jobName,
                        schedule: parsedSchedule
                    });
                    datalistHtml += `<option value="${t.name}">`;
                }
            });

            SCHOOL_MAP = mapData;

        function generateSmartSuggestions() {
            const day = document.getElementById("smart-day").value;
            const stage = document.getElementById("smart-stage").value;
            const container = document.getElementById("suggestion-container");
            const infoBox = document.getElementById("smart-criteria-info");
            const diagBox = document.getElementById("smart-diagnostic");
            
            container.innerHTML = "";
            diagBox.innerHTML = `<i class="fa-solid fa-users"></i> إجمالي المعلمين بالمنظومة: <b>${ALL_TEACHERS.length}</b>`;

            if(ALL_TEACHERS.length === 0) {
                container.innerHTML = "<div style='grid-column:1/-1; color:var(--danger); text-align:center; font-weight:bold; padding:20px;'><i class=\"fa-solid fa-triangle-exclamation\"></i> لم يتم تحميل أي معلمين من قاعدة البيانات!</div>";
                return;
            }

            const totalP = PERIOD_CONFIG[stage][day];
            infoBox.innerHTML = `<b>المرحلة:</b> ${stage==='lower'?'صفوف أولى':'صفوف عليا'} | <b>نصاب يوم ${day}:</b> ${totalP} حصص. (الترتيب حسب التواجد بالدور، والفراغ بآخر الحصص، والتخصص).`;

            if(!SCHOOL_MAP || SCHOOL_MAP.length === 0) {
                container.innerHTML = "<div style='grid-column:1/-1; color:var(--danger); text-align:center; font-weight:bold; padding:20px;'>يرجى إعداد خريطة المبنى أولاً.</div>";
                return;
            }

            const stageMapping = FLOOR_LOCS_MAP[stage] || {};
            let targetFloors = [];

            SCHOOL_MAP.forEach(bldg => {
                if (bldg.floors) {
                    bldg.floors.forEach(floor => {
                        const mapKey = `${bldg.name}_${floor.name}`;
                        if(stageMapping[mapKey]) {
                            targetFloors.push({
                                bldgName: bldg.name,
                                floorName: floor.name,
                                locKeys: stageMapping[mapKey],
                                classes: (floor.rooms || []).map(r => extractClassSignature(r))
                            });
                        }
                    });
                }
            });

            if(targetFloors.length === 0) {
                container.innerHTML = "<div style='grid-column:1/-1; color:var(--danger); text-align:center; font-weight:bold; padding:15px;'>لم يتم العثور على أدوار مطابقة لهذه المرحلة.</div>";
                return;
            }

            let html = "";
            targetFloors.forEach(floor => {
                let candidateScores = [];

                ALL_TEACHERS.forEach(t => {
                    let classesInThisFloor = 0;
                    let hasLowerClasses = false;
                    let hasUpperClasses = false;

                    for(let p = 1; p <= 8; p++) {
                        let rawCls = getTeacherClass(t.schedule, day, p);
                        if(rawCls) {
                            let cleanCls = extractClassSignature(rawCls);
                            if(floor.classes.includes(cleanCls)) classesInThisFloor++;
                            if (/^[1-3]/.test(cleanCls)) hasLowerClasses = true;
                            if (/^[4-6]/.test(cleanCls)) hasUpperClasses = true;
                        }
                    }

                    let score = classesInThisFloor * 15;
                    const isClassTeacher = /فصل/i.test(t.cadre) || hasLowerClasses;
                    if(stage === 'lower' && isClassTeacher) score += 10;
                    if(stage === 'upper' && !isClassTeacher && hasUpperClasses) score += 10;

                    const freeLast = !getTeacherClass(t.schedule, day, totalP);
                    const freeBeforeLast = !getTeacherClass(t.schedule, day, totalP - 1);

                    let statusBadge = "";
                    if(freeLast && freeBeforeLast) {
                        score += 25;
                        statusBadge = `فاضي آخر حصتين (${totalP-1} و ${totalP}) ⭐`;
                    } else if(freeLast) {
                        score += 15;
                        statusBadge = `فاضي الحصة الأخيرة (${totalP}) ✔️`;
                    } else if(freeBeforeLast) {
                        score += 5;
                        statusBadge = `فاضي الحصة (${totalP-1})`;
                    } else {
                        score -= 10;
                        statusBadge = `مشغول لنهاية اليوم (${totalP})`;
                    }

                    if(classesInThisFloor > 0 || (score >= 20 && (stage === 'lower' ? hasLowerClasses : hasUpperClasses))) {
                        candidateScores.push({
                            name: t.name,
                            score: score,
                            floorClasses: classesInThisFloor,
                            statusBadge: statusBadge
                        });
                    }
                });

                candidateScores.sort((a,b) => b.score - a.score);
                const topCandidates = candidateScores.slice(0, 4);

                let teachersHtml = "";
                if(topCandidates.length > 0) {
                    let medals = ['🥇', '🥈', '🥉', '🏅'];
                    topCandidates.forEach((t, i) => {
                        const targetKeys = JSON.stringify(floor.locKeys).replace(/"/g, '&quot;');
                        teachersHtml += `
                            <div class="sug-teacher" onclick="autoAssignTeacher('${stage}', ${targetKeys}, '${t.name}', this)">
                                <span class="sug-t-name">${medals[i]} ${t.name}</span>
                                <span class="sug-t-desc">${t.floorClasses} حصص بالدور | ${t.statusBadge}</span>
                            </div>
                        `;
                    });
                } else {
                    teachersHtml = "<div style='font-size:11px; color:#94a3b8; text-align:center; padding: 6px;'>لا توجد حصص مسجلة لأي معلم بهذا الدور في هذا اليوم.</div>";
                }

                html += `
                    <div class="sug-card">
                        <div class="sug-loc">
                            <i class="fa-solid fa-location-dot" style="color:var(--smart);"></i> ${floor.bldgName} - ${floor.floorName}
                            <span style="font-size:11px; color:#64748b;">(مطلوب ${floor.locKeys.length} مشرف)</span>
                        </div>
                        ${teachersHtml}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function autoAssignTeacher(stage, locKeys, teacherName, btnEl) {
            document.getElementById("day-select").value = document.getElementById("smart-day").value;
            switchTab(stage);

            let assignedLoc = null;
            for(let key of locKeys) {
                let input = document.querySelector(`.search-input[data-stage="${stage}"][data-loc="${key}"]`);
                if(input && input.value.trim() === "") {
                    assignedLoc = key;
                    input.value = teacherName;
                    break;
                }
            }

            if(!assignedLoc) {
                assignedLoc = locKeys[0];
                let input = document.querySelector(`.search-input[data-stage="${stage}"][data-loc="${assignedLoc}"]`);
                if(input) input.value = teacherName;
            }

            btnEl.style.background = "#dcfce7";
            btnEl.style.borderColor = "#16a34a";

            let targetInput = document.querySelector(`.search-input[data-stage="${stage}"][data-loc="${assignedLoc}"]`);
            if(targetInput) {
                targetInput.style.backgroundColor = "#dcfce7";
                setTimeout(() => targetInput.style.backgroundColor = "", 1000);
            }

            Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1000, icon: 'success', title: `تم تسكين ${teacherName}` });
        }

        // ================= تصوير عالي الوضوح =================
        function takeSupervisionScreenshot() {
            const dayText = document.getElementById("day-select").options[document.getElementById("day-select").selectedIndex].text;
            const isLower = document.getElementById('tab-btn-lower').classList.contains('active');
            const stageText = isLower ? "الصفوف الأولى (1 - 3)" : "الصفوف العليا (4 - 6)";
            const activeTab = isLower ? document.getElementById('tab-lower') : document.getElementById('tab-upper');

            let cardsHtml = "";
            const cards = activeTab.querySelectorAll('.building-card');
            
            cards.forEach(card => {
                const bldgTitle = card.querySelector('.building-header').innerText.trim();
                const rows = card.querySelectorAll('.input-group');
                let rowsHtml = "";
                rows.forEach(row => {
                    const label = row.querySelector('label').innerText.trim();
                    const val = row.querySelector('input').value.trim() || "—";
                    rowsHtml += `
                        <div style="margin-bottom: 5px; text-align: right;">
                            <div style="color: #000; font-weight: 900; font-size: 11px;">${label}</div>
                            <div style="background: #fff; color: #000; border: 1.5px solid #000; border-radius: 4px; padding: 4px 6px; font-size: 13px; font-weight: 900; text-align: center; min-height: 28px;">
                                ${val}
                            </div>
                        </div>
                    `;
                });

                cardsHtml += `
                    <div style="background: #fff; border: 2px solid #1e3a8a; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column;">
                        <div style="background: #1e3a8a; color: #fff; font-weight: 900; font-size: 13px; padding: 6px; text-align: center;">${bldgTitle}</div>
                        <div style="padding: 8px; background: #fff; display: flex; flex-direction: column; gap: 2px;">${rowsHtml}</div>
                    </div>
                `;
            });

            const printContainer = document.createElement('div');
            printContainer.style.position = 'fixed';
            printContainer.style.top = '-9999px';
            printContainer.style.width = '1200px';
            printContainer.style.background = '#fff';
            printContainer.style.padding = '20px';
            printContainer.style.direction = 'rtl';
            printContainer.style.fontFamily = "'Cairo', Arial, sans-serif";

            printContainer.innerHTML = `
                <div style="background: #1e3a8a; color: #fff; padding: 10px 20px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <div><h3 style="margin: 0; font-size: 16px; font-weight: 900;">مدرسة الشهيد أشرف حبيب الابتدائية</h3><div style="font-size: 12px;">العام الدراسي ٢٠٢٦ / ٢٠٢٧</div></div>
                    <div><h2 style="margin: 0; font-size: 17px; font-weight: 900; color: #fcd34d;">جدول الإشراف اليومي (${stageText})</h2><div style="font-size: 13px; font-weight: 800;">يوم ${dayText}</div></div>
                </div>
                <div style="display: grid; grid-template-columns: repeat(${cards.length}, 1fr); gap: 10px;">${cardsHtml}</div>
                <div style="border: 1.5px solid #000; border-radius: 6px; padding: 8px 15px; margin-top: 12px; display: flex; justify-content: space-between; font-weight: 900; font-size: 12px;">
                    <div>تصميم وإعداد: أ. عبدالعزيز لولح (مستر زيزو)</div>
                    <div>يعتمد / مدير المدرسة: .......................................</div>
                </div>
            `;

            document.body.appendChild(printContainer);
            html2canvas(printContainer, { scale: 2, backgroundColor: "#ffffff" }).then(canvas => {
                document.body.removeChild(printContainer);
                let link = document.createElement('a');
                link.download = `جدول_الإشراف_${dayText}_${isLower ? 'صفوف_أولى' : 'صفوف_عليا'}.jpg`;
                link.href = canvas.toDataURL("image/jpeg", 1.0);
                link.click();
            });
        }
    </script>
