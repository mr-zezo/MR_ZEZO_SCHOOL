<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعداد الإشراف اليومي - منظومة زيزو</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase & SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root { 
            --primary: #1e3a8a; --secondary: #3b82f6; --accent: #f59e0b;
            --dark: #0f172a; --bg: #f8fafc; --surface: #ffffff;
            --danger: #e11d48; --success: #10b981; --border: #cbd5e1;
            --smart: #8b5cf6; /* لون مميز للمساعد الذكي */
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--dark); display: flex; flex-direction: column; align-items: center; padding: 20px; }

        /* ================= الشريط العلوي ================= */
        .top-nav { width: 100%; max-width: 1200px; background: var(--dark); padding: 15px 25px; border-radius: 12px; color: white; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 15px;}
        .nav-title { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 900; color: #fcd34d; margin: 0; }
        .nav-actions { display: flex; gap: 15px; align-items: center;}
        
        .quick-nav-select { padding: 8px 15px; border-radius: 8px; border: 1px solid #fcd34d; background: var(--primary); color: white; font-weight: bold; font-family: 'Cairo'; outline: none; cursor: pointer; }
        .quick-nav-select option { background: white; color: black; }

        .btn-nav { text-decoration: none; color: white; background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 900; transition: 0.2s; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.2);}
        .btn-nav:hover { background: rgba(255,255,255,0.2); }

        /* ================= أدوات التحكم والمساعد الذكي ================= */
        .controls-bar { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 15px 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02); flex-wrap: wrap; gap: 15px;}
        
        .day-group { display: flex; align-items: center; gap: 10px; }
        .day-group label { font-weight: 900; font-size: 15px; color: var(--primary); }
        .day-selector { padding: 10px 20px; font-size: 15px; font-weight: 900; border-radius: 8px; border: 2px solid var(--primary); outline: none; background: #eff6ff; color: var(--primary); cursor: pointer;}
        
        .btn-smart { background: linear-gradient(135deg, var(--smart), #6d28d9); color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 900; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); transition: 0.2s; animation: pulseSmart 2s infinite;}
        .btn-smart:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4); }
        @keyframes pulseSmart { 0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(139, 92, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); } }

        .btn-save { background: var(--success); color: white; border: none; padding: 12px 30px; border-radius: 10px; font-weight: 900; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); transition: 0.2s; }
        .btn-save:hover { transform: translateY(-2px); }

        /* ================= التبويبات ================= */
        .tabs { display: flex; width: 100%; max-width: 1200px; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 15px; background: white; border: 2px solid var(--border); border-radius: 12px; font-size: 16px; font-weight: 900; color: #64748b; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 15px rgba(30,58,138,0.2); }

        /* ================= حاويات الإدخال ================= */
        .tab-content { width: 100%; max-width: 1200px; display: none; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .tab-content.active { display: grid; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .building-card { background: white; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.03); }
        .building-header { background: #f8fafc; padding: 12px 15px; font-weight: 900; font-size: 15px; color: var(--primary); border-bottom: 2px solid var(--border); display: flex; align-items: center; gap: 8px; }
        .building-body { padding: 15px; display: flex; flex-direction: column; gap: 12px; }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 13px; font-weight: bold; color: #475569; }
        .search-input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; font-weight: 900; outline: none; transition: 0.3s; background: #f1f5f9; color: var(--primary);}
        .search-input:focus { border-color: var(--accent); background: white; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1); }

        datalist { font-family: 'Cairo'; }

        /* ================= نافذة المساعد الذكي ================= */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.8); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--bg); width: 100%; max-width: 800px; border-radius: 15px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); display: flex; flex-direction: column; max-height: 90vh; }
        
        .modal-header { background: linear-gradient(135deg, var(--smart), #6d28d9); color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { font-size: 18px; font-weight: 900; margin: 0; display: flex; align-items: center; gap: 10px;}
        .btn-close { background: rgba(255,255,255,0.2); border: none; color: white; width: 35px; height: 35px; border-radius: 8px; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center;}
        
        .modal-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;}
        
        .smart-controls { display: flex; gap: 15px; background: white; padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .smart-controls select { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-weight: 900; outline: none; font-size: 14px;}
        .btn-generate { background: var(--dark); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 900; cursor: pointer; transition: 0.2s;}
        .btn-generate:hover { background: var(--primary); }

        .suggestion-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .sug-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 15px; border-top: 4px solid var(--smart); box-shadow: 0 4px 6px rgba(0,0,0,0.02);}
        .sug-loc { font-size: 15px; font-weight: 900; color: var(--dark); margin-bottom: 10px; border-bottom: 1px dashed var(--border); padding-bottom: 5px;}
        
        .sug-teacher { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.2s;}
        .sug-teacher:hover { background: #dcfce7; border-color: #86efac; transform: translateX(-5px);}
        .sug-t-name { font-size: 14px; font-weight: 900; color: var(--primary); display: flex; align-items: center; gap: 8px;}
        .sug-t-score { font-size: 11px; font-weight: bold; background: var(--smart); color: white; padding: 2px 8px; border-radius: 12px; }

        @media (max-width: 768px) {
            .top-nav { flex-direction: column; text-align: center; }
            .controls-bar { flex-direction: column; text-align: center; }
            .btn-smart, .btn-save { width: 100%; justify-content: center; }
            .smart-controls { flex-direction: column; }
        }
    </style>
</head>
<body>

    <datalist id="teachers-list"></datalist>

    <nav class="top-nav">
        <h1 class="nav-title"><i class="fa-solid fa-clipboard-user"></i> إعداد جداول الإشراف</h1>
        <div class="nav-actions">
            <select class="quick-nav-select" onchange="if(this.value) window.location.href=this.value;">
                <option value="" disabled selected>🚀 انتقال سريع...</option>
                <option value="index.html">الرئيسية</option>
                <option value="schedule.html">الجدول المدرسي</option>
                <option value="school-map.html">خريطة المبنى</option>
                <option value="supervisor.html">بوابة المشرف العام</option>
            </select>
        </div>
    </nav>

    <div class="controls-bar">
        <div class="day-group">
            <label>إعداد إشراف يوم:</label>
            <select class="day-selector" id="day-select" onchange="loadSupervisionData()">
                <option value="الاحد">الأحد</option><option value="الاثنين">الإثنين</option>
                <option value="الثلاثاء">الثلاثاء</option><option value="الاربعاء">الأربعاء</option>
                <option value="الخميس">الخميس</option>
            </select>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn-smart" onclick="openSmartAssistant()"><i class="fa-solid fa-wand-magic-sparkles"></i> المساعد الذكي للتوزيع</button>
            <button class="btn-save" onclick="saveSupervisionData()"><i class="fa-solid fa-floppy-disk"></i> حفظ الإشراف بالسحابة</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('lower')">إشراف الصفوف الأولى (1 - 3)</button>
        <button class="tab-btn" onclick="switchTab('upper')">إشراف الصفوف العليا (4 - 6)</button>
    </div>

    <!-- ================= شاشة الصفوف الأولى ================= -->
    <div id="tab-lower" class="tab-content active">
        <div class="building-card">
            <div class="building-header"><i class="fa-solid fa-star"></i> القيادة والفناء</div>
            <div class="building-body">
                <div class="input-group"><label>المشرف العام</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="general" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (1)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="yard_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (2)</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="yard_2" placeholder="ابحث بالاسم..."></div>
            </div>
        </div>

        <div class="building-card">
            <div class="building-header"><i class="fa-regular fa-building"></i> المبنى القديم</div>
            <div class="building-body">
                <div class="input-group"><label>الدور الأرضي</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="old_ground" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثاني</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="old_f2" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثالث</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="old_f3" placeholder="ابحث بالاسم..."></div>
            </div>
        </div>

        <div class="building-card">
            <div class="building-header"><i class="fa-solid fa-city"></i> المبنى الشرقي</div>
            <div class="building-body">
                <div class="input-group"><label>الدور الأرضي</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="east_ground" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثاني</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="east_f2" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثالث</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="east_f3" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الرابع</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="east_f4" placeholder="ابحث بالاسم..."></div>
            </div>
        </div>

        <div class="building-card">
            <div class="building-header"><i class="fa-solid fa-hotel"></i> المبنى الجديد</div>
            <div class="building-body">
                <div class="input-group"><label>الدور الأرضي</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="new_ground" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثاني</label><input type="text" list="teachers-list" class="search-input" data-stage="lower" data-loc="new_f2" placeholder="ابحث بالاسم..."></div>
            </div>
        </div>
    </div>

    <!-- ================= شاشة الصفوف العليا ================= -->
    <div id="tab-upper" class="tab-content">
        <div class="building-card">
            <div class="building-header"><i class="fa-solid fa-star"></i> القيادة والفناء</div>
            <div class="building-body">
                <div class="input-group"><label>المشرف العام</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="general" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (1)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="yard_1" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>مشرف فناء (2)</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="yard_2" placeholder="ابحث بالاسم..."></div>
            </div>
        </div>

        <div class="building-card">
            <div class="building-header"><i class="fa-solid fa-hotel"></i> المبنى الجديد</div>
            <div class="building-body">
                <div class="input-group"><label>الدور الأرضي</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_ground" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثاني</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f2" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الثالث</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f3" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الرابع</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f4" placeholder="ابحث بالاسم..."></div>
                <div class="input-group"><label>الدور الخامس</label><input type="text" list="teachers-list" class="search-input" data-stage="upper" data-loc="new_f5" placeholder="ابحث بالاسم..."></div>
            </div>
        </div>
    </div>

    <!-- ================= نافذة المساعد الذكي ================= -->
    <div class="modal-overlay" id="smartModal" onclick="if(event.target===this) this.classList.remove('active')">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fa-solid fa-wand-magic-sparkles"></i> المساعد الذكي لتوزيع الإشراف</h2>
                <button class="btn-close" onclick="document.getElementById('smartModal').classList.remove('active')">&times;</button>
            </div>
            <div class="modal-body">
                <div style="background:#f0fdf4; color:#166534; padding:10px; border-radius:8px; font-size:13px; font-weight:bold; margin-bottom:15px; border:1px solid #bbf7d0;">
                    <i class="fa-solid fa-circle-info"></i> سيقوم الذكاء الاصطناعي بمسح (الخريطة) و (الجدول)، ليقترح لك المعلمين المتواجدين بالفعل في كل دور. اضغط على اسم المعلم لتسكينه فوراً!
                </div>
                
                <div class="smart-controls">
                    <select id="smart-day">
                        <option value="الاحد">يوم الأحد</option><option value="الاثنين">الإثنين</option><option value="الثلاثاء">الثلاثاء</option><option value="الاربعاء">الأربعاء</option><option value="الخميس">الخميس</option>
                    </select>
                    <select id="smart-stage">
                        <option value="lower">صفوف أولى</option><option value="upper">صفوف عليا</option>
                    </select>
                    <button class="btn-generate" onclick="generateSmartSuggestions()"><i class="fa-solid fa-bolt"></i> توليد الاقتراحات</button>
                </div>

                <div class="suggestion-grid" id="suggestion-container" style="margin-top:20px;">
                    <!-- تولد برمجياً -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================= إعدادات Supabase =================
        const supabaseUrl = 'https://xgsyktjoerrymqoutqcb.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhnc3lrdGpvZXJyeW1xb3V0cWNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NzI2OTUsImV4cCI6MjA5OTA0ODY5NX0.fVdQnU8lQnacNzDTNXtAODbV3Jbgq5ACg5KIw0HFYLM';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let ALL_TEACHERS = [];
        let SCHOOL_MAP = [];

        // خريطة لربط أسماء الأدوار في (خريطة المدرسة) مع أكواد الإدخال في (صفحة الإشراف)
        const LOC_MAPPING = {
            "المبنى القديم_الدور الأرضي": "old_ground", "المبنى القديم_الدور الثاني": "old_f2", "المبنى القديم_الدور الثالث": "old_f3",
            "المبنى الشرقي_الدور الأرضي": "east_ground", "المبنى الشرقي_الدور الثاني": "east_f2", "المبنى الشرقي_الدور الثالث": "east_f3", "المبنى الشرقي_الدور الرابع": "east_f4",
            "المبنى الجديد_الدور الأرضي": "new_ground", "المبنى الجديد_الدور الثاني": "new_f2", "المبنى الجديد_الدور الثالث": "new_f3", "المبنى الجديد_الدور الرابع": "new_f4", "المبنى الجديد_الدور الخامس": "new_f5"
        };

        window.addEventListener('DOMContentLoaded', async () => {
            await fetchBaseData();
            loadSupervisionData();
        });

        function switchTab(stage) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${stage}`).classList.add('active');
        }

        // ================= جلب البيانات الأساسية =================
        async function fetchBaseData() {
            try {
                const [resTea, resCon, resMap] = await Promise.all([
                    supabaseClient.from("teachers").select("name, cadre_job, schedule").eq("emp_status", "على رأس العمل"),
                    supabaseClient.from("contract_teachers").select("name, schedule").eq("status", "يعمل"),
                    supabaseClient.from("school_map").select("map_data").eq("id", "main_layout").maybeSingle()
                ]);

                ALL_TEACHERS = [];
                let datalistHtml = "";

                const isTeacher = (job) => !(job||"").replace(/\s+/g,"").match(/عامل|اداري|اخصائي|مشرف|سكرتير|فني|خدمات/);
                
                (resTea.data || []).forEach(t => {
                    if(isTeacher(t.cadre_job)) {
                        ALL_TEACHERS.push({ name: t.name, short_name: t.name.split(' ')[0] + " " + t.name.split(' ')[t.name.split(' ').length-1], schedule: t.schedule||{} });
                        datalistHtml += `<option value="${t.name}">`;
                    }
                });
                (resCon.data || []).forEach(t => {
                    ALL_TEACHERS.push({ name: t.name, short_name: t.name.split(' ')[0] + " " + t.name.split(' ')[t.name.split(' ').length-1], schedule: t.schedule||{} });
                    datalistHtml += `<option value="${t.name}">`;
                });

                document.getElementById("teachers-list").innerHTML = datalistHtml;

                if(resMap.data && resMap.data.map_data) {
                    SCHOOL_MAP = resMap.data.map_data;
                }
            } catch(e) { console.error("Error fetching base data"); }
        }

        // ================= تحميل وحفظ الإشراف (التقليدي) =================
        async function loadSupervisionData() {
            document.querySelectorAll('.search-input').forEach(inp => inp.value = "");
            const day = document.getElementById("day-select").value;
            
            Swal.fire({ title: 'جاري التحميل...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const { data } = await supabaseClient.from("supervision").select("*").eq("day", day);
                if (data && data.length > 0) {
                    data.forEach(record => {
                        const stage = record.stage;
                        const assignments = record.data || {};
                        for(let loc in assignments) {
                            let input = document.querySelector(`.search-input[data-stage="${stage}"][data-loc="${loc}"]`);
                            if(input) input.value = assignments[loc];
                        }
                    });
                }
                Swal.close();
            } catch(e) { Swal.fire('خطأ', 'فشل التحميل', 'error'); }
        }

        async function saveSupervisionData() {
            const day = document.getElementById("day-select").value;
            let lowerData = {}; let upperData = {};

            document.querySelectorAll('.search-input[data-stage="lower"]').forEach(inp => {
                if(inp.value.trim() !== "") lowerData[inp.getAttribute("data-loc")] = inp.value.trim();
            });
            document.querySelectorAll('.search-input[data-stage="upper"]').forEach(inp => {
                if(inp.value.trim() !== "") upperData[inp.getAttribute("data-loc")] = inp.value.trim();
            });

            const recordsToUpsert = [
                { id: `${day}_lower`, day: day, stage: 'lower', data: lowerData },
                { id: `${day}_upper`, day: day, stage: 'upper', data: upperData }
            ];

            Swal.fire({ title: 'جاري الحفظ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                await supabaseClient.from("supervision").upsert(recordsToUpsert);
                Swal.fire({ icon: 'success', title: 'تم الحفظ بنجاح!', timer: 1500, showConfirmButton: false });
            } catch(e) { Swal.fire('خطأ', 'فشل الحفظ', 'error'); }
        }

        // ================= المساعد الذكي (الذكاء الاصطناعي) =================
        function openSmartAssistant() {
            // مزامنة اليوم في المساعد مع اليوم المختار حالياً
            document.getElementById("smart-day").value = document.getElementById("day-select").value;
            document.getElementById("smart-stage").value = document.querySelector('.tab-btn.active').innerText.includes('أولى') ? 'lower' : 'upper';
            document.getElementById("suggestion-container").innerHTML = "";
            document.getElementById("smartModal").classList.add("active");
        }

        function isClassRoom(val) {
            return /^[0-9٠-٩]+\s*\/\s*[0-9٠-٩]+$/.test(val);
        }

        function generateSmartSuggestions() {
            const day = document.getElementById("smart-day").value;
            const stage = document.getElementById("smart-stage").value;
            const container = document.getElementById("suggestion-container");
            container.innerHTML = "";

            if(SCHOOL_MAP.length === 0) {
                container.innerHTML = "<div style='grid-column:1/-1; color:red; text-align:center; font-weight:bold;'>لم يتم إعداد (خريطة المبنى المدرسي) بعد! يرجى إعدادها أولاً ليعمل المساعد الذكي.</div>";
                return;
            }

            // 1. استخراج الأدوار الخاصة بالمرحلة المحددة
            let targetFloors = [];
            SCHOOL_MAP.forEach(bldg => {
                bldg.floors.forEach(floor => {
                    if(floor.stage === stage) {
                        let locKey = LOC_MAPPING[`${bldg.name}_${floor.name}`];
                        if(locKey) {
                            targetFloors.push({
                                bldgName: bldg.name,
                                floorName: floor.name,
                                locKey: locKey,
                                classes: floor.rooms.filter(r => isClassRoom(r))
                            });
                        }
                    }
                });
            });

            if(targetFloors.length === 0) {
                container.innerHTML = "<div style='grid-column:1/-1; color:red; text-align:center; font-weight:bold;'>لم يتم العثور على أدوار مخصصة لهذه المرحلة في الخريطة.</div>";
                return;
            }

            // 2. حساب النقاط لكل معلم في كل دور
            let html = "";
            targetFloors.forEach(floor => {
                let scores = {}; // { "اسم المعلم": عدد الحصص }
                
                ALL_TEACHERS.forEach(t => {
                    for(let p=1; p<=8; p++) {
                        let taughtClass = t.schedule[`${day}_${p}`];
                        if(taughtClass && floor.classes.includes(taughtClass)) {
                            scores[t.name] = (scores[t.name] || 0) + 1;
                        }
                    }
                });

                // ترتيب المعلمين لأخذ أفضل 3
                let topTeachers = Object.keys(scores)
                    .map(name => ({ name: name, score: scores[name] }))
                    .sort((a,b) => b.score - a.score)
                    .slice(0, 3);

                let teachersHtml = "";
                if(topTeachers.length > 0) {
                    let medals = ['🥇', '🥈', '🥉'];
                    topTeachers.forEach((t, i) => {
                        teachersHtml += `
                            <div class="sug-teacher" onclick="applySuggestion('${stage}', '${floor.locKey}', '${t.name}')">
                                <span class="sug-t-name">${medals[i]} ${t.name}</span>
                                <span class="sug-t-score">${t.score} حصص هنا</span>
                            </div>
                        `;
                    });
                } else {
                    teachersHtml = "<div style='font-size:12px; color:#94a3b8; text-align:center;'>لا يوجد معلمون لديهم حصص بهذا الدور اليوم.</div>";
                }

                html += `
                    <div class="sug-card">
                        <div class="sug-loc">${floor.bldgName} - ${floor.floorName}</div>
                        ${teachersHtml}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // دالة التسكين التلقائي عند الضغط على الاقتراح
        function applySuggestion(stage, locKey, teacherName) {
            // 1. مزامنة الواجهة الخلفية مع اختيارات المساعد
            document.getElementById("day-select").value = document.getElementById("smart-day").value;
            switchTab(stage);

            // 2. إيجاد الحقل وكتابة الاسم
            let input = document.querySelector(`.search-input[data-stage="${stage}"][data-loc="${locKey}"]`);
            if(input) {
                input.value = teacherName;
                
                // تأثير بصري جميل لتأكيد الإضافة
                input.style.backgroundColor = "#dcfce7";
                input.style.borderColor = "#16a34a";
                input.style.color = "#166534";
                
                setTimeout(() => {
                    input.style.backgroundColor = "";
                    input.style.borderColor = "";
                    input.style.color = "";
                }, 1500);

                // إغلاق النافذة للعودة للعمل
                document.getElementById('smartModal').classList.remove('active');
                
                Swal.fire({ toast: true, position: 'top', icon: 'success', title: 'تم التسكين بنجاح!', showConfirmButton: false, timer: 1500 });
            }
        }
    </script>
